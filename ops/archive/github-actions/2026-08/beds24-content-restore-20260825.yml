name: Beds24 content restore AUMARA 2026-08-25

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beds24-content-restore-20260825.yml'

permissions:
  contents: write

concurrency:
  group: beds24-content-restore-324882
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: Production
    env:
      BEDS24_API_KEY: ${{ secrets.BEDS24_API_KEY }}
      BEDS24_PROP_KEY: ${{ secrets.BEDS24_PROP_KEY }}
      PROPERTY_ID: '324882'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore descriptions and verify exact readback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import datetime as dt
          import json
          import os
          import pathlib
          import subprocess
          import time
          import urllib.error
          import urllib.request

          api=(os.environ.get('BEDS24_API_KEY') or '').strip()
          prop=(os.environ.get('BEDS24_PROP_KEY') or '').strip()
          pid=int(os.environ.get('PROPERTY_ID','324882'))
          if not api or not prop:
              raise SystemExit('Beds24 V1 content credentials missing in Production')
          print(f'::add-mask::{api}')
          print(f'::add-mask::{prop}')
          auth={'apiKey':api,'propKey':prop}

          def post(path,payload):
              raw=json.dumps(payload,ensure_ascii=False).encode('utf-8')
              req=urllib.request.Request(
                  'https://api.beds24.com/json/'+path,
                  data=raw,
                  headers={'Content-Type':'application/json','Accept':'application/json','User-Agent':'AUMARA-Control-Tower/1.0'},
                  method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=90) as r:
                      body=r.read(); status=int(r.status)
              except urllib.error.HTTPError as e:
                  body=e.read(); status=int(e.code)
              try: data=json.loads(body.decode('utf-8','replace')) if body else {}
              except Exception: data={'non_json_bytes':len(body)}
              if not 200 <= status < 300:
                  raise SystemExit(f'{path} HTTP {status}: {str(data)[:1200]}')
              return data

          HEADLINE={
            'ES':'Chalets tranquilos con piscina compartida en la Costa Blanca',
            'EN':'Peaceful chalets with a shared pool on the Costa Blanca',
            'DE':'Ruhige Chalets mit Gemeinschaftspool an der Costa Blanca',
            'FR':'Chalets paisibles avec piscine partagée sur la Costa Blanca',
            'IT':'Chalet tranquilli con piscina condivisa sulla Costa Blanca',
            'PT':'Chalés tranquilos com piscina partilhada na Costa Blanca',
            'RU':'Спокойные шале с общим бассейном на Коста-Бланке',
            'NL':'Rustige chalets met gedeeld zwembad aan de Costa Blanca'
          }
          PROPERTY_DESCRIPTION={
            'ES':'Aumara El Cid es un alojamiento tranquilo en la Costa Blanca, rodeado de naturaleza y zonas exteriores. Los chalets disponen de aire acondicionado, Wi-Fi, baño privado y una zona de cocina con nevera, microondas, hervidor, cafetera, fregadero y menaje. Los huéspedes pueden disfrutar de la piscina compartida, el jardín y las zonas exteriores. Todos los alojamientos son para no fumadores.',
            'EN':'Aumara El Cid is a peaceful Costa Blanca stay surrounded by nature and outdoor space. The chalets offer air conditioning, Wi-Fi, a private bathroom and a kitchenette with a refrigerator, microwave, kettle, coffee maker, sink and utensils. Guests can enjoy the shared pool, garden and outdoor areas. All accommodation is non-smoking.',
            'DE':'Aumara El Cid ist eine ruhige Unterkunft an der Costa Blanca, umgeben von Natur und Außenbereichen. Die Chalets verfügen über Klimaanlage, WLAN, ein eigenes Bad und eine Küchenzeile mit Kühlschrank, Mikrowelle, Wasserkocher, Kaffeemaschine, Spüle und Geschirr. Gästen stehen der Gemeinschaftspool, der Garten und die Außenbereiche zur Verfügung. Alle Unterkünfte sind Nichtraucherunterkünfte.',
            'FR':"Aumara El Cid est un hébergement paisible sur la Costa Blanca, entouré de nature et d'espaces extérieurs. Les chalets disposent de la climatisation, du Wi-Fi, d'une salle de bain privée et d'une kitchenette avec réfrigérateur, micro-ondes, bouilloire, cafetière, évier et vaisselle. Les voyageurs peuvent profiter de la piscine partagée, du jardin et des espaces extérieurs. Tous les hébergements sont non-fumeurs.",
            'IT':'Aumara El Cid è una struttura tranquilla sulla Costa Blanca, circondata dalla natura e da spazi esterni. Gli chalet dispongono di aria condizionata, Wi-Fi, bagno privato e angolo cottura con frigorifero, microonde, bollitore, macchina da caffè, lavello e utensili. Gli ospiti possono utilizzare la piscina condivisa, il giardino e gli spazi esterni. Tutti gli alloggi sono non fumatori.',
            'PT':'Aumara El Cid é um alojamento tranquilo na Costa Blanca, rodeado de natureza e espaços exteriores. Os chalés dispõem de ar condicionado, Wi-Fi, casa de banho privativa e kitchenette com frigorífico, micro-ondas, chaleira, máquina de café, lava-loiça e utensílios. Os hóspedes podem desfrutar da piscina partilhada, do jardim e das áreas exteriores. Todos os alojamentos são para não fumadores.',
            'RU':'Aumara El Cid — спокойное место для отдыха на Коста-Бланке, окружённое природой и открытыми зонами. В шале есть кондиционер, Wi-Fi, собственная ванная комната и мини-кухня с холодильником, микроволновой печью, чайником, кофеваркой, мойкой и посудой. Гости могут пользоваться общим бассейном, садом и открытыми зонами. Во всех помещениях проживание для некурящих.',
            'NL':'Aumara El Cid is een rustige accommodatie aan de Costa Blanca, omgeven door natuur en buitenruimte. De chalets hebben airconditioning, wifi, een eigen badkamer en een kitchenette met koelkast, magnetron, waterkoker, koffiezetapparaat, gootsteen en keukengerei. Gasten kunnen gebruikmaken van het gedeelde zwembad, de tuin en de buitenruimtes. Alle accommodaties zijn rookvrij.'
          }
          LOCATION={
            'ES':'Un entorno tranquilo de la Costa Blanca, pensado para descansar y disfrutar de la naturaleza y de las zonas exteriores.',
            'EN':'A peaceful Costa Blanca setting for relaxing and enjoying nature and the outdoor areas.',
            'DE':'Eine ruhige Lage an der Costa Blanca zum Entspannen und Genießen der Natur und Außenbereiche.',
            'FR':'Un cadre paisible sur la Costa Blanca pour se détendre et profiter de la nature et des espaces extérieurs.',
            'IT':'Un ambiente tranquillo sulla Costa Blanca, ideale per rilassarsi e godersi la natura e gli spazi esterni.',
            'PT':'Um ambiente tranquilo na Costa Blanca para descansar e aproveitar a natureza e as áreas exteriores.',
            'RU':'Спокойная обстановка на Коста-Бланке для отдыха на природе и на открытом воздухе.',
            'NL':'Een rustige omgeving aan de Costa Blanca om te ontspannen en van de natuur en buitenruimtes te genieten.'
          }
          HOUSE_RULES={
            'ES':'Alojamiento para no fumadores. Respeta las zonas comunes y utiliza la piscina y los espacios exteriores de forma responsable.',
            'EN':'Non-smoking accommodation. Please respect shared areas and use the pool and outdoor spaces responsibly.',
            'DE':'Nichtraucherunterkunft. Bitte respektieren Sie die Gemeinschaftsbereiche und nutzen Sie Pool und Außenbereiche verantwortungsvoll.',
            'FR':'Hébergement non-fumeur. Merci de respecter les espaces communs et d’utiliser la piscine et les espaces extérieurs de manière responsable.',
            'IT':'Alloggio non fumatori. Si prega di rispettare le aree comuni e di utilizzare la piscina e gli spazi esterni in modo responsabile.',
            'PT':'Alojamento para não fumadores. Respeite as áreas comuns e utilize a piscina e os espaços exteriores de forma responsável.',
            'RU':'Размещение для некурящих. Пожалуйста, бережно относитесь к общим зонам и ответственно пользуйтесь бассейном и открытыми пространствами.',
            'NL':'Rookvrije accommodatie. Respecteer de gedeelde ruimtes en gebruik het zwembad en de buitenruimtes op verantwoorde wijze.'
          }

          def room_description(label):
              return {
                'ES':f'{label} privado con aire acondicionado, Wi-Fi, baño privado y zona de cocina con nevera, microondas, hervidor, cafetera, fregadero y menaje. Acceso a piscina compartida, jardín y zonas exteriores. Alojamiento para no fumadores.',
                'EN':f'Private {label} with air conditioning, Wi-Fi, a private bathroom and a kitchenette with a refrigerator, microwave, kettle, coffee maker, sink and utensils. Access to the shared pool, garden and outdoor areas. Non-smoking accommodation.',
                'DE':f'Privates {label} mit Klimaanlage, WLAN, eigenem Bad und Küchenzeile mit Kühlschrank, Mikrowelle, Wasserkocher, Kaffeemaschine, Spüle und Geschirr. Zugang zum Gemeinschaftspool, Garten und den Außenbereichen. Nichtraucherunterkunft.',
                'FR':f'{label} privé avec climatisation, Wi-Fi, salle de bain privée et kitchenette avec réfrigérateur, micro-ondes, bouilloire, cafetière, évier et vaisselle. Accès à la piscine partagée, au jardin et aux espaces extérieurs. Hébergement non-fumeur.',
                'IT':f'{label} privato con aria condizionata, Wi-Fi, bagno privato e angolo cottura con frigorifero, microonde, bollitore, macchina da caffè, lavello e utensili. Accesso alla piscina condivisa, al giardino e agli spazi esterni. Alloggio non fumatori.',
                'PT':f'{label} privado com ar condicionado, Wi-Fi, casa de banho privativa e kitchenette com frigorífico, micro-ondas, chaleira, máquina de café, lava-loiça e utensílios. Acesso à piscina partilhada, ao jardim e às áreas exteriores. Alojamento para não fumadores.',
                'RU':f'{label}: отдельное шале с кондиционером, Wi-Fi, собственной ванной комнатой и мини-кухней с холодильником, микроволновой печью, чайником, кофеваркой, мойкой и посудой. Доступ к общему бассейну, саду и открытым зонам. Размещение для некурящих.',
                'NL':f'Privé {label} met airconditioning, wifi, eigen badkamer en kitchenette met koelkast, magnetron, waterkoker, koffiezetapparaat, gootsteen en keukengerei. Toegang tot het gedeelde zwembad, de tuin en buitenruimtes. Rookvrije accommodatie.'
              }

          chalet=room_description('Chalet')
          superior=room_description('Superior Chalet')

          def room_payload(display, desc, airbnb_name):
              return {
                'texts':{
                  'displayName':display,
                  'roomDescription1':desc,
                  'contentHeadlineText':display,
                  'contentDescriptionText':desc
                },
                'airbnb':{
                  'name':{'ES':airbnb_name},
                  'summaryText':{'ES':desc['ES']},
                  'spaceText':{'ES':'Chalet privado con baño y zona de cocina compacta equipada con nevera, microondas, hervidor, cafetera, fregadero y menaje.'},
                  'accessText':{'ES':'Los huéspedes tienen acceso a su chalet y a las zonas comunes exteriores, incluida la piscina compartida y el jardín.'},
                  'interactionText':{'ES':'El equipo está disponible para ayudar durante la estancia cuando sea necesario.'},
                  'notesText':{'ES':'La piscina y las zonas exteriores son compartidas con otros huéspedes. Todos los alojamientos son para no fumadores.'},
                  'houseRulesText':{'ES':HOUSE_RULES['ES']}
                }
              }

          display_chalet={k:'Chalet' for k in PROPERTY_DESCRIPTION}
          display_superior={k:('Chalet Superior' if k in ('ES','PT') else 'Superior Chalet') for k in PROPERTY_DESCRIPTION}
          changes={
            'action':'modify',
            'texts':{
              'headlineText':HEADLINE,
              'propertyDescription1':PROPERTY_DESCRIPTION,
              'propertyDescriptionText':PROPERTY_DESCRIPTION,
              'propertyDescriptionBookingPage1':PROPERTY_DESCRIPTION,
              'locationDescription':LOCATION,
              'houseRules':HOUSE_RULES
            },
            'roomIds':{
              '674465':room_payload(display_chalet,chalet,'Chalet · Aumara El Cid'),
              '674466':room_payload(display_superior,superior,'Chalet Superior · Aumara El Cid')
            }
          }

          def read_content():
              data=post('getPropertyContent',{
                'authentication':auth,
                'bookingData':False,
                'images':False,
                'roomIds':True,
                'texts':True,
                'includeAirbnb':True,
                'includeVrbo':False
              })
              rows=data.get('getPropertyContent') if isinstance(data,dict) else None
              if not isinstance(rows,list) or not rows or not isinstance(rows[0],dict):
                  raise SystemExit('Unexpected getPropertyContent response shape')
              return rows[0]

          def relevant(obj):
              out={'texts':{},'roomIds':{}}
              for key in changes['texts']:
                  out['texts'][key]=(obj.get('texts') or {}).get(key)
              for rid,rchange in changes['roomIds'].items():
                  room=(obj.get('roomIds') or {}).get(rid) or {}
                  out['roomIds'][rid]={'texts':{},'airbnb':{}}
                  for key in rchange['texts']:
                      out['roomIds'][rid]['texts'][key]=(room.get('texts') or {}).get(key)
                  for key in rchange['airbnb']:
                      out['roomIds'][rid]['airbnb'][key]=(room.get('airbnb') or {}).get(key)
              return out

          before=read_content()
          evidence={
            'schema':'aumara.beds24-content-restore.v1',
            'property_id':pid,
            'started_at_utc':dt.datetime.now(dt.timezone.utc).isoformat(),
            'before':relevant(before),
            'requested':{'texts':changes['texts'],'roomIds':changes['roomIds']},
            'status':'STARTING',
            'secret_exposed':False
          }
          path=pathlib.Path('aumara-control-tower/evidence/beds24-content-restore-20260825.json')
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(evidence,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')

          response=post('setPropertyContent',{'authentication':auth,'setPropertyContent':[changes]})
          evidence['write_response']=response
          time.sleep(4)
          after=read_content()
          evidence['after']=relevant(after)

          mismatches=[]
          for key,wanted in changes['texts'].items():
              got=(after.get('texts') or {}).get(key)
              for lang,val in wanted.items():
                  if not isinstance(got,dict) or got.get(lang)!=val:
                      mismatches.append(f'texts.{key}.{lang}')
          for rid,rchange in changes['roomIds'].items():
              room=(after.get('roomIds') or {}).get(rid) or {}
              for key,wanted in rchange['texts'].items():
                  got=(room.get('texts') or {}).get(key)
                  for lang,val in wanted.items():
                      if not isinstance(got,dict) or got.get(lang)!=val:
                          mismatches.append(f'roomIds.{rid}.texts.{key}.{lang}')
              for key,wanted in rchange['airbnb'].items():
                  got=(room.get('airbnb') or {}).get(key)
                  for lang,val in wanted.items():
                      if not isinstance(got,dict) or got.get(lang)!=val:
                          mismatches.append(f'roomIds.{rid}.airbnb.{key}.{lang}')

          evidence['mismatches']=mismatches
          evidence['status']='SUCCESS' if not mismatches else 'FAILED_READBACK'
          evidence['finished_at_utc']=dt.datetime.now(dt.timezone.utc).isoformat()
          text=json.dumps(evidence,ensure_ascii=False,indent=2,sort_keys=True)
          for secret in (api,prop): text=text.replace(secret,'[REDACTED]')
          path.write_text(text+'\n',encoding='utf-8')

          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',str(path)],check=True)
          if subprocess.run(['git','diff','--cached','--quiet'],check=False).returncode != 0:
              subprocess.run(['git','commit','-m',f'Record AUMARA Beds24 content restore {evidence["status"]} [skip ci]'],check=True)
              subprocess.run(['git','pull','--rebase','origin','main'],check=True)
              subprocess.run(['git','push','origin','HEAD:main'],check=True)

          print(json.dumps({'status':evidence['status'],'mismatch_count':len(mismatches),'mismatches':mismatches[:20]},ensure_ascii=False))
          if mismatches:
              raise SystemExit(1)
          PY