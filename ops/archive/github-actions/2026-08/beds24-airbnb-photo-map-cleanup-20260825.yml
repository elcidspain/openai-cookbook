name: Beds24 Airbnb photo map cleanup AUMARA 2026-08-25

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beds24-airbnb-photo-map-cleanup-20260825.yml'

permissions:
  contents: write

concurrency:
  group: beds24-airbnb-photo-map-cleanup-324882
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      BEDS24_API_KEY: ${{ secrets.BEDS24_API_KEY }}
      BEDS24_PROP_KEY: ${{ secrets.BEDS24_PROP_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move approved picture set to clean slots and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import datetime as dt, json, os, pathlib, subprocess, time, urllib.error, urllib.request

          ROOT=pathlib.Path.cwd()
          API=(os.environ.get('BEDS24_API_KEY') or '').strip()
          PROP=(os.environ.get('BEDS24_PROP_KEY') or '').strip()
          if not API or not PROP:
              raise SystemExit('Beds24 V1 credentials missing')
          print(f'::add-mask::{API}')
          print(f'::add-mask::{PROP}')
          auth={'apiKey':API,'propKey':PROP}
          asset_commit='3c69fba2479dd5ed44ab2320c0d7a0add7212e26'
          manifest_path=ROOT/'aumara-control-tower/evidence/beds24-airbnb-photo-api-sync-20260825-manifest.json'
          if not manifest_path.exists():
              raise SystemExit('Approved media manifest missing')
          rows=json.loads(manifest_path.read_text(encoding='utf-8'))['records']
          if len(rows)!=18:
              raise SystemExit(f'Expected 18 approved records, got {len(rows)}')
          base=f'https://raw.githubusercontent.com/elcidspain/openai-cookbook/{asset_commit}/'
          for row in rows:
              row['url']=base+row['path']

          def post(path,payload):
              raw=json.dumps(payload,ensure_ascii=False).encode('utf-8')
              req=urllib.request.Request('https://api.beds24.com/json/'+path,data=raw,headers={'Content-Type':'application/json','Accept':'application/json','User-Agent':'AUMARA-Control-Tower/1.0'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=90) as r:
                      body=r.read(); status=int(r.status)
              except urllib.error.HTTPError as e:
                  body=e.read(); status=int(e.code)
              try: data=json.loads(body.decode('utf-8','replace')) if body else {}
              except Exception: data={'raw':body.decode('utf-8','replace')[:1000]}
              if not 200 <= status < 300:
                  raise SystemExit(f'{path} HTTP {status}: {str(data)[:1200]}')
              return data

          def read_root():
              data=post('getPropertyContent',{'authentication':auth,'bookingData':False,'images':True,'roomIds':True,'texts':False,'includeAirbnb':True,'includeVrbo':False})
              return (data.get('getPropertyContent') or [{}])[0]

          before=read_root()
          room_ids=before.get('roomIds') or {}
          gates={}
          for rid in ('674465','674466'):
              a=((room_ids.get(rid) or {}).get('airbnb') or {})
              gates[rid]={k:a.get(k) for k in ('listingId','publish','picturesFrom')}
              if not str(gates[rid].get('listingId') or '').strip():
                  raise SystemExit(f'{rid}: missing Airbnb listingId')
              if str(gates[rid].get('publish') or '').lower()!='no':
                  raise SystemExit(f'{rid}: publish gate is not NO')

          common=sorted((r for r in rows if r['category']=='common'),key=lambda r:r['index'])
          chalet=sorted((r for r in rows if r['category']=='chalet'),key=lambda r:r['index'])
          superior=sorted((r for r in rows if r['category']=='superior'),key=lambda r:r['index'])
          if (len(common),len(chalet),len(superior))!=(14,3,1):
              raise SystemExit('Approved category counts changed')

          # Use slots 81-98 because the pre-write schema probe proved these slots had empty maps.
          canonical={}
          slot=81
          for pos,row in enumerate(common,1):
              canonical[str(slot)]={'url':row['url'],'map':[
                  {'position':str(pos),'propId':'324882','roomId':'674465'},
                  {'position':str(pos),'propId':'324882','roomId':'674466'},
              ]}
              slot+=1
          for pos,row in enumerate(chalet,15):
              canonical[str(slot)]={'url':row['url'],'map':[{'position':str(pos),'propId':'324882','roomId':'674465'}]}
              slot+=1
          for pos,row in enumerate(superior,15):
              canonical[str(slot)]={'url':row['url'],'map':[{'position':str(pos),'propId':'324882','roomId':'674466'}]}
              slot+=1
          if set(canonical)!=set(str(i) for i in range(81,99)):
              raise SystemExit('Canonical slot allocation invalid')

          # First write into clean slots. Then blank URLs in the first attempt's slots;
          # stale maps are harmless when their URL is empty and remain auditable.
          clear={str(i):{'url':''} for i in range(1,19)}
          response=post('setPropertyContent',{
              'authentication':auth,
              'setPropertyContent':[{
                  'action':'modify',
                  'images':{'external':{**canonical,**clear}},
                  'roomIds':{
                      '674465':{'airbnb':{'picturesFrom':'rop','publish':'no'}},
                      '674466':{'airbnb':{'picturesFrom':'rop','publish':'no'}},
                  },
              }]
          })
          time.sleep(6)
          after=read_root()
          actual=((after.get('images') or {}).get('external') or {})
          mismatches=[]

          def norm_map(rows):
              return sorted((str(x.get('propId','')),str(x.get('roomId','')),str(x.get('position',''))) for x in (rows or []))

          for key,wanted in canonical.items():
              got=actual.get(key) or {}
              if got.get('url')!=wanted['url']:
                  mismatches.append({'slot':key,'field':'url','wanted':wanted['url'],'got':got.get('url')})
              if norm_map(got.get('map'))!=norm_map(wanted['map']):
                  mismatches.append({'slot':key,'field':'map','wanted':wanted['map'],'got':got.get('map')})
          uncleared=[]
          for key in clear:
              got=actual.get(key) or {}
              if str(got.get('url') or '')!='':
                  uncleared.append({'slot':key,'url':got.get('url')})

          effective={'674465':[],'674466':[]}
          for key,row in actual.items():
              if not isinstance(row,dict) or not str(row.get('url') or '').strip():
                  continue
              for m in row.get('map') or []:
                  rid=str(m.get('roomId') or '')
                  if rid in effective:
                      effective[rid].append({'slot':str(key),'position':str(m.get('position') or ''),'url':row.get('url')})
          counts={rid:len(entries) for rid,entries in effective.items()}
          positions={rid:sorted(int(x['position']) for x in entries if str(x['position']).isdigit()) for rid,entries in effective.items()}
          expected_positions={'674465':list(range(1,18)),'674466':list(range(1,16))}
          for rid in expected_positions:
              if positions[rid]!=expected_positions[rid]:
                  mismatches.append({'roomId':rid,'field':'effective_positions','wanted':expected_positions[rid],'got':positions[rid]})

          after_rooms=after.get('roomIds') or {}
          room_state={}
          for rid in ('674465','674466'):
              a=((after_rooms.get(rid) or {}).get('airbnb') or {})
              room_state[rid]={k:a.get(k) for k in ('listingId','publish','picturesFrom','propertyTypeGroup','listingType')}
              if str(room_state[rid].get('publish') or '').lower()!='no':
                  mismatches.append({'roomId':rid,'field':'publish','wanted':'no','got':room_state[rid].get('publish')})

          evidence={
              'schema':'aumara.beds24-airbnb-photo-map-cleanup.v1',
              'checked_at_utc':dt.datetime.now(dt.timezone.utc).isoformat(),
              'property_id':324882,
              'asset_commit':asset_commit,
              'canonical_slots':'81-98',
              'expected_counts':{'674465':17,'674466':15},
              'effective_counts':counts,
              'effective_positions':positions,
              'uncleared_old_urls':uncleared,
              'room_state':room_state,
              'write_response':response,
              'mismatches':mismatches,
              'status':'SUCCESS' if not mismatches and not uncleared and counts=={'674465':17,'674466':15} else 'FAILED_READBACK',
              'secret_exposed':False,
          }
          text=json.dumps(evidence,ensure_ascii=False,indent=2,sort_keys=True)
          for secret in (API,PROP): text=text.replace(secret,'[REDACTED]')
          out=ROOT/'aumara-control-tower/evidence/beds24-airbnb-photo-map-cleanup-20260825.json'
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(text+'\n',encoding='utf-8')
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',str(out)],check=True)
          if subprocess.run(['git','diff','--cached','--quiet'],check=False).returncode!=0:
              subprocess.run(['git','commit','-m',f'Record AUMARA canonical photo map {evidence["status"]} [skip ci]'],check=True)
              subprocess.run(['git','pull','--rebase','origin','main'],check=True)
              subprocess.run(['git','push','origin','HEAD:main'],check=True)
          print(json.dumps({'status':evidence['status'],'effective_counts':counts,'uncleared_old_urls':len(uncleared),'mismatch_count':len(mismatches),'room_state':room_state},ensure_ascii=False))
          if evidence['status']!='SUCCESS':
              raise SystemExit(1)
          PY