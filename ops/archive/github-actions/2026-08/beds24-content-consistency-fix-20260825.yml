name: Beds24 content consistency fix AUMARA 2026-08-25

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beds24-content-consistency-fix-20260825.yml'

permissions:
  contents: write

concurrency:
  group: beds24-content-consistency-fix-324882
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      BEDS24_API_KEY: ${{ secrets.BEDS24_API_KEY }}
      BEDS24_PROP_KEY: ${{ secrets.BEDS24_PROP_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove contradictory room feature flags and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt, json, os, pathlib, subprocess, time, urllib.error, urllib.request

          api=(os.environ.get('BEDS24_API_KEY') or '').strip()
          prop=(os.environ.get('BEDS24_PROP_KEY') or '').strip()
          if not api or not prop:
              raise SystemExit('Beds24 V1 credentials missing in Production')
          print(f'::add-mask::{api}')
          print(f'::add-mask::{prop}')
          auth={'apiKey':api,'propKey':prop}

          def post(path,payload):
              raw=json.dumps(payload,ensure_ascii=False).encode('utf-8')
              req=urllib.request.Request('https://api.beds24.com/json/'+path,data=raw,headers={'Content-Type':'application/json','Accept':'application/json','User-Agent':'AUMARA-Control-Tower/1.0'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=90) as r:
                      body=r.read(); status=int(r.status)
              except urllib.error.HTTPError as e:
                  body=e.read(); status=int(e.code)
              try: data=json.loads(body.decode('utf-8','replace')) if body else {}
              except Exception: data={'non_json_bytes':len(body)}
              if not 200 <= status < 300:
                  raise SystemExit(f'{path} HTTP {status}: {str(data)[:1200]}')
              return data

          def read_content():
              data=post('getPropertyContent',{'authentication':auth,'bookingData':False,'images':False,'roomIds':True,'texts':False,'includeAirbnb':True,'includeVrbo':False})
              rows=data.get('getPropertyContent') if isinstance(data,dict) else None
              if not isinstance(rows,list) or not rows or not isinstance(rows[0],dict):
                  raise SystemExit('Unexpected getPropertyContent response shape')
              return rows[0]

          remove={'POOL_PRIVATE','PETS_CONSIDERED'}
          before=read_content()
          room_changes={}
          before_codes={}
          wanted_codes={}
          for rid in ('674465','674466'):
              room=((before.get('roomIds') or {}).get(rid) or {})
              codes=room.get('featureCodes') or []
              before_codes[rid]=codes
              cleaned=[]
              for group in codes:
                  if not isinstance(group,list):
                      cleaned.append(group); continue
                  keep=[code for code in group if code not in remove]
                  if keep:
                      cleaned.append(keep)
              wanted_codes[rid]=cleaned
              room_changes[rid]={'featureCodes':cleaned}

          response=post('setPropertyContent',{'authentication':auth,'setPropertyContent':[{'action':'modify','roomIds':room_changes}]})
          time.sleep(4)
          after=read_content()
          after_codes={rid:(((after.get('roomIds') or {}).get(rid) or {}).get('featureCodes') or []) for rid in room_changes}

          mismatches=[]
          for rid in room_changes:
              flat=[code for group in after_codes[rid] if isinstance(group,list) for code in group]
              bad=sorted(remove.intersection(flat))
              if bad:
                  mismatches.append({'roomId':rid,'remaining':bad})

          evidence={
              'schema':'aumara.beds24-content-consistency-fix.v1',
              'checked_at_utc':dt.datetime.now(dt.timezone.utc).isoformat(),
              'removed_flags':sorted(remove),
              'before':before_codes,
              'wanted':wanted_codes,
              'after':after_codes,
              'write_response':response,
              'mismatches':mismatches,
              'status':'SUCCESS' if not mismatches else 'FAILED_READBACK',
              'secret_exposed':False
          }
          text=json.dumps(evidence,ensure_ascii=False,indent=2,sort_keys=True)
          for secret in (api,prop): text=text.replace(secret,'[REDACTED]')
          path=pathlib.Path('aumara-control-tower/evidence/beds24-content-consistency-fix-20260825.json')
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(text+'\n',encoding='utf-8')

          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',str(path)],check=True)
          if subprocess.run(['git','diff','--cached','--quiet'],check=False).returncode != 0:
              subprocess.run(['git','commit','-m',f'Record AUMARA Beds24 content consistency fix {evidence["status"]} [skip ci]'],check=True)
              subprocess.run(['git','pull','--rebase','origin','main'],check=True)
              subprocess.run(['git','push','origin','HEAD:main'],check=True)

          print(json.dumps({'status':evidence['status'],'removed':sorted(remove),'mismatches':mismatches},ensure_ascii=False))
          if mismatches:
              raise SystemExit(1)
          PY