name: Beds24 Airbnb Chalet operational retry 2026-08-25

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beds24-airbnb-chalet-operational-retry-20260825.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production
    env:
      BEDS24_API_KEY: ${{ secrets.BEDS24_API_KEY }}
      BEDS24_PROP_KEY: ${{ secrets.BEDS24_PROP_KEY }}
    steps:
      - name: Write Chalet only and verify with delayed reads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request
          api=(os.environ.get('BEDS24_API_KEY') or '').strip(); prop=(os.environ.get('BEDS24_PROP_KEY') or '').strip()
          if not api or not prop: raise SystemExit('Beds24 credentials missing')
          print(f'::add-mask::{api}'); print(f'::add-mask::{prop}')
          auth={'apiKey':api,'propKey':prop}
          check='El check-in se realiza en Aumara El Cid. El equipo estará disponible para recibirte y ayudarte con el acceso al chalet. El día de llegada recibirás la información final de acceso y contacto. Si tu hora prevista cambia, avísanos por el chat de Airbnb.'
          manual='Bienvenido a Aumara El Cid. El chalet dispone de Wi-Fi, aire acondicionado, baño privado y zona de cocina compacta con nevera, microondas, hervidor, cafetera, fregadero y menaje. La piscina, el jardín y las zonas exteriores son compartidos con otros huéspedes. Respeta las horas de descanso y las zonas comunes. Todos los alojamientos son para no fumadores.'
          def post(path,payload):
            req=urllib.request.Request('https://api.beds24.com/json/'+path,data=json.dumps(payload,ensure_ascii=False).encode(),headers={'Content-Type':'application/json','Accept':'application/json'},method='POST')
            try:
              with urllib.request.urlopen(req,timeout=60) as r: body=r.read(); status=r.status
            except urllib.error.HTTPError as e: body=e.read(); status=e.code
            data=json.loads(body.decode('utf-8','replace')) if body else {}
            if not 200 <= int(status) < 300: raise SystemExit(f'{path} HTTP {status}: {str(data)[:1200]}')
            return data
          payload={'authentication':auth,'setPropertyContent':[{'action':'modify','roomIds':{'674465':{'cleaningFee':'20.00','airbnb':{'checkInText':check,'houseManualText':manual,'custom':'CLEANINGFEE 20'}}}}]}
          wr=post('setPropertyContent',payload)
          got=None
          for wait in (4,8,12):
            time.sleep(wait)
            root=(post('getPropertyContent',{'authentication':auth,'bookingData':False,'images':False,'roomIds':True,'texts':True,'includeAirbnb':True,'includeVrbo':False}).get('getPropertyContent') or [{}])[0]
            room=(root.get('roomIds') or {}).get('674465') or {}; air=room.get('airbnb') or {}
            got={'cleaningFee':str(room.get('cleaningFee') or ''),'checkInText':str(air.get('checkInText') or ''),'houseManualText':str(air.get('houseManualText') or ''),'custom':str(air.get('custom') or '')}
            if got=={'cleaningFee':'20.00','checkInText':check,'houseManualText':manual,'custom':'CLEANINGFEE 20'}: break
          ok=(got=={'cleaningFee':'20.00','checkInText':check,'houseManualText':manual,'custom':'CLEANINGFEE 20'})
          print(json.dumps({'status':'SUCCESS' if ok else 'FAILED_READBACK','write_response':wr,'after':got},ensure_ascii=False))
          if not ok: raise SystemExit(1)
          PY