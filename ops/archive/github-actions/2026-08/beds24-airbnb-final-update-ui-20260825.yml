name: Push corrected AUMARA Chalet to Airbnb 2026-08-26

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beds24-airbnb-final-update-ui-20260825.yml'

permissions:
  contents: read

concurrency:
  group: beds24-airbnb-chalet-push-324882
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      BEDS24_USERNAME: ${{ secrets.BEDS24_USERNAME }}
      BEDS24_PASSWORD: ${{ secrets.BEDS24_PASSWORD }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser runtime
        run: |
          pip install 'playwright>=1.55,<2'
          playwright install --with-deps chromium
      - name: Click Update for Chalet only and verify Beds24 response
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          from playwright.sync_api import sync_playwright
          RID='674465'; LID='1759764557896676605'; PID='324882'
          user=(os.getenv('BEDS24_USERNAME') or '').strip() or 'EL CID / AUMARA'; pw=(os.getenv('BEDS24_PASSWORD') or '').strip()
          if not pw: raise SystemExit('BEDS24_PASSWORD missing')
          print(f'::add-mask::{user}'); print(f'::add-mask::{pw}')
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True); page=browser.new_page(viewport={'width':1600,'height':1200}); page.set_default_timeout(30000); page.on('dialog',lambda d:d.accept())
            writes=[]
            page.on('response',lambda r: writes.append({'method':r.request.method,'status':r.status,'url':r.url.split('?')[0]}) if r.request.method in ('POST','PUT','PATCH') else None)
            page.goto('https://beds24.com/control3.php',wait_until='domcontentloaded',timeout=60000)
            secret=page.locator("input[type='password']").first
            if secret.count():
              usr=page.locator("input[name='username'],input[name='user'],input[autocomplete='username'],input[type='email']").first
              if not usr.count(): usr=page.locator("input[type='text']").first
              if not usr.count(): raise SystemExit('Beds24 login username field not found')
              usr.fill(user); secret.fill(pw)
              btn=page.locator("button[type='submit'],input[type='submit'],#loginButton,button:has-text('Log in'),button:has-text('Login'),button:has-text('Sign in')").first
              if not btn.count(): raise SystemExit('Beds24 login submit not found')
              btn.click(); page.wait_for_timeout(4500)
            if page.locator("input[type='password']").count(): raise SystemExit('Beds24 login requires fresh interactive authorization')
            page.goto('https://beds24.com/control3.php?pagetype=synchroniserairbnbmap',wait_until='domcontentloaded',timeout=60000); page.wait_for_timeout(1800)
            # Select AUMARA property if selector is present.
            for sel in page.locator('select').all():
              try: opts=sel.locator('option').evaluate_all("els=>els.map(o=>({t:(o.textContent||'').trim(),v:o.value||''}))")
              except Exception: continue
              hit=next((o for o in opts if PID in o['t'] or PID in o['v']),None)
              if hit:
                if sel.input_value()!=hit['v']: sel.select_option(hit['v']); page.wait_for_timeout(1800)
                break
            rows=page.locator('tr'); row=rows.filter(has_text=RID).first
            if not row.count(): row=rows.filter(has_text=LID).first
            if not row.count(): raise SystemExit('Exact Chalet mapping row not found')
            before=row.inner_text()
            if 'Everything' not in before: raise SystemExit('Chalet Sync Type is not Everything')
            update=row.locator("button:has-text('Update'),a:has-text('Update'),input[value='Update']").first
            if not update.count(): raise SystemExit('Chalet Update control not found')
            n=len(writes); update.click(); page.wait_for_timeout(7000); new=writes[n:]
            visible=[]
            for loc in page.locator('.error,.alert-danger,.text-danger,[role="alert"]').all():
              try:
                if loc.is_visible() and (loc.inner_text() or '').strip(): visible.append((loc.inner_text() or '').strip()[:1200])
              except Exception: pass
            print(json.dumps({'roomId':RID,'listingId':LID,'row_before':before[:1200],'write_responses':new[-20:],'visible_errors':visible},ensure_ascii=False))
            browser.close()
            if visible: raise SystemExit('Beds24/Airbnb returned visible error: '+str(visible[:3]))
            if not any(200 <= int(x['status']) < 400 for x in new): raise SystemExit('No successful write response observed after Chalet Update')
          PY
