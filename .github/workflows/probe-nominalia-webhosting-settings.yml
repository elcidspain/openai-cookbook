name: Probe Nominalia webhosting settings safely

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-nominalia-webhosting-settings.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: NOMINALIA_FTP_PASSWORD
    env:
      FTP_HOST: elcidt.ftp.tb-hosting.com
      FTP_USER: elcidspaincom@elcidspaincom
      FTP_PASSWORD: ${{ secrets.NOMINALIAFTPPASSWORD }}
    steps:
      - name: Install FTP client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Fetch and sanitize webhosting settings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_PASSWORD"
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "set cmd:fail-exit yes; set ftp:ssl-allow no; set ftp:passive-mode yes; get .webhosting/settings -o /tmp/settings; bye"
          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path

          text=Path('/tmp/settings').read_text(errors='replace')
          out=[]
          safe_value=re.compile(r'^(?:https?://)?(?:[a-z0-9-]+\.)+[a-z]{2,}(?::\d+)?(?:/[^\s]*)?$|^/[A-Za-z0-9._/-]+$|^\d{1,3}(?:\.\d{1,3}){3}$', re.I)
          sensitive_name=re.compile(r'pass|secret|token|key|auth|credential|session|cookie', re.I)
          for n,line in enumerate(text.splitlines(),1):
              s=line.strip()
              if not s or s.startswith(('#',';')):
                  continue
              if '=' in s:
                  k,v=s.split('=',1); k=k.strip(); v=v.strip()
              elif ':' in s:
                  k,v=s.split(':',1); k=k.strip(); v=v.strip()
              else:
                  out.append({'line':n,'kind':'bare','length':len(s),'sha256_12':hashlib.sha256(s.encode()).hexdigest()[:12]})
                  continue
              if sensitive_name.search(k):
                  shown='REDACTED'
              elif safe_value.match(v):
                  shown=v
              else:
                  shown=f'REDACTED(len={len(v)},sha256={hashlib.sha256(v.encode()).hexdigest()[:12]})'
              out.append({'line':n,'key':k,'value':shown})
          print(json.dumps({'bytes':len(text.encode()),'entries':out},ensure_ascii=False,indent=2))
          PY
