name: Probe Nominalia control via existing hosting credential

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-nominalia-control-via-hosting-secret.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: NOMINALIA_FTP_PASSWORD
    env:
      NOMINALIA_USER: ID29270161-NOMI
      NOMINALIA_PASSWORD: ${{ secrets.NOMINALIAFTPPASSWORD }}
    steps:
      - name: Probe control login without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NOMINALIA_PASSWORD"
          python -m pip install --disable-pip-version-check -q requests beautifulsoup4
          python - <<'PY'
          import os, json
          from urllib.parse import urljoin, urlparse
          import requests
          from bs4 import BeautifulSoup

          user=os.environ['NOMINALIA_USER']
          password=os.environ['NOMINALIA_PASSWORD']
          s=requests.Session()
          s.headers['User-Agent']='Mozilla/5.0 RealitySift authorized Nominalia control probe'
          r=s.get('https://controlpanel.nominalia.com/welcome.html',timeout=30,allow_redirects=True)
          r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          form=next((f for f in soup.find_all('form') if f.find('input',{'type':'password'})),None)
          if not form:
              print(json.dumps({'status':'NO_LOGIN_FORM','host':urlparse(r.url).netloc,'path':urlparse(r.url).path}))
              raise SystemExit(0)

          fields=[]
          for i in form.find_all('input'):
              name=i.get('name')
              if not name: continue
              typ=(i.get('type') or 'text').lower()
              if typ in {'submit','button','image','file','reset'}: continue
              if typ in {'checkbox','radio'} and not i.has_attr('checked'): continue
              fields.append((name,i.get('value',''))

          p=form.find('input',{'type':'password'})
          visible=[i for i in form.find_all('input') if i.get('name') and (i.get('type') or 'text').lower() in {'text','email'}]
          if not p or not visible:
              print(json.dumps({'status':'FIELDS_NOT_FOUND'})); raise SystemExit(0)
          uname=visible[0].get('name'); pname=p.get('name')
          data=[]
          for k,v in fields:
              if k==uname: v=user
              elif k==pname: v=password
              data.append((k,v))
          if uname not in {k for k,_ in data}: data.append((uname,user))
          if pname not in {k for k,_ in data}: data.append((pname,password))

          action=urljoin(r.url,form.get('action') or r.url)
          method=(form.get('method') or 'get').lower()
          rr=s.post(action,data=data,timeout=30,allow_redirects=True) if method=='post' else s.get(action,params=data,timeout=30,allow_redirects=True)
          rr.raise_for_status()
          ss=BeautifulSoup(rr.text,'html.parser')
          text=ss.get_text(' ',strip=True).lower()
          path=urlparse(rr.url).path.lower()
          still_login=bool(ss.find('input',{'type':'password'})) and ('welcome' in path or 'login' in path)
          stepup=any(x in text for x in ['verification code','código de verificación','two-factor','2fa','one-time code','código de seguridad','otp'])
          status='AUTH_STEPUP_REQUIRED' if stepup else ('AUTH_FAILED' if still_login else 'AUTHENTICATED')
          print(json.dumps({'status':status,'host':urlparse(rr.url).netloc,'path':urlparse(rr.url).path,'title':ss.title.string.strip()[:120] if ss.title and ss.title.string else ''},ensure_ascii=False))
          PY
