name: Beds24 credential check
on: [workflow_dispatch, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      B24_TOKEN_CREDENTIAL: ${{ secrets.BEDS24_TOKEN_CREDENTIAL }}
    steps:
      - name: Exchange refresh token and run read-only probe
        shell: bash
        run: |
          set -euo pipefail
          r=$(curl