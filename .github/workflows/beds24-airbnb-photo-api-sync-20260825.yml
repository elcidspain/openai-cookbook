name: Beds24 Airbnb photo API sync AUMARA 2026-08-25

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beds24-airbnb-photo-api-sync-20260825.yml'

permissions:
  contents: write

concurrency:
  group: beds24-airbnb-photo-api-sync-324882
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: Production
    env:
      BEDS24_API_KEY: ${{ secrets.BEDS24_API_KEY }}
      BEDS24_PROP_KEY: ${{ secrets.BEDS24_PROP_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install media dependencies
        run: pip install --disable-pip-version-check 'gdown>=5.2,<6' 'pillow>=11,<12'

      - name: Prepare immutable approved image hosting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import pathlib
          import re
          import shutil
          import subprocess
          import zipfile

          import gdown
          from PIL import Image, ImageOps

          ROOT=pathlib.Path.cwd()
          WORK=ROOT/'tmp-aumara-airbnb-photo-api-sync'
          OUT=ROOT/'aumara-control-tower/public/airbnb/20260825'
          MANIFEST=ROOT/'aumara-control-tower/evidence/beds24-airbnb-photo-api-sync-20260825-manifest.json'
          ZIP_MANIFEST=[
              ('common','AUMARA_COMMON_14.zip','1nKYEWf7wt-dKyMSqn7cGBZY1Fsqfnh5j',14),
              ('chalet','AUMARA_CHALET_3.zip','1q2EgyxM0jaGdoIrZMHRFIRmU4Z53CDgg',3),
              ('superior','AUMARA_SUPERIOR_1.zip','1Det-7VAFrXW47F2zO8sh87De3unKRz49',1),
          ]
          if WORK.exists(): shutil.rmtree(WORK)
          if OUT.exists(): shutil.rmtree(OUT)
          WORK.mkdir(parents=True)
          OUT.mkdir(parents=True)
          records=[]
          for category,zip_name,file_id,expected in ZIP_MANIFEST:
              archive=WORK/zip_name
              if not gdown.download(id=file_id,output=str(archive),quiet=False):
                  raise SystemExit(f'Drive download failed: {zip_name}')
              target_dir=WORK/category
              target_dir.mkdir(parents=True)
              with zipfile.ZipFile(archive) as zf:
                  names=[n for n in zf.namelist() if not n.endswith('/')]
                  if any(n.startswith('/') or '..' in pathlib.PurePosixPath(n).parts for n in names):
                      raise SystemExit(f'Unsafe archive paths: {zip_name}')
                  zf.extractall(target_dir)
              sources=sorted(p for p in target_dir.rglob('*') if p.is_file() and p.suffix.lower() in {'.jpg','.jpeg','.png','.webp'})
              if len(sources)!=expected:
                  raise SystemExit(f'{category}: expected {expected} images, got {len(sources)}')
              cat_out=OUT/category
              cat_out.mkdir(parents=True)
              for index,src in enumerate(sources,1):
                  raw=src.read_bytes()
                  if len(raw)<50000:
                      raise SystemExit(f'Image too small: {src.name}')
                  with Image.open(src) as opened:
                      image=ImageOps.exif_transpose(opened).convert('RGB')
                      original=list(image.size)
                  if max(image.size)>2560:
                      image.thumbnail((2560,2560),Image.Resampling.LANCZOS)
                  safe=re.sub(r'[^A-Za-z0-9._-]+','_',src.stem)[:60]
                  dest=cat_out/f'{index:02d}_{safe}.jpg'
                  quality=90
                  while True:
                      image.save(dest,'JPEG',quality=quality,optimize=True,progressive=True)
                      if dest.stat().st_size<=4_500_000 or quality<=72:
                          break
                      quality-=4
                  records.append({
                      'category':category,
                      'index':index,
                      'source':src.name,
                      'path':dest.relative_to(ROOT).as_posix(),
                      'sha256':hashlib.sha256(dest.read_bytes()).hexdigest(),
                      'bytes':dest.stat().st_size,
                      'original_size':original,
                      'hosted_size':list(image.size),
                  })
          if len(records)!=18:
              raise SystemExit(f'Expected 18 records, got {len(records)}')
          MANIFEST.parent.mkdir(parents=True,exist_ok=True)
          MANIFEST.write_text(json.dumps({'expected_total':18,'records':records},ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')

          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',str(OUT),str(MANIFEST)],check=True)
          if subprocess.run(['git','diff','--cached','--quiet'],check=False).returncode!=0:
              subprocess.run(['git','commit','-m','Host approved AUMARA Airbnb media [skip ci]'],check=True)
              subprocess.run(['git','pull','--rebase','origin','main'],check=True)
              subprocess.run(['git','push','origin','HEAD:main'],check=True)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          with open(pathlib.Path(__import__('os').environ['GITHUB_ENV']),'a',encoding='utf-8') as fh:
              fh.write(f'ASSET_COMMIT={sha}\n')
          print(json.dumps({'status':'PREPARED','count':len(records),'asset_commit':sha}))
          PY

      - name: Verify public image URLs then write Beds24 picture map
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import json
          import os
          import pathlib
          import subprocess
          import time
          import urllib.error
          import urllib.request

          ROOT=pathlib.Path.cwd()
          api=(os.environ.get('BEDS24_API_KEY') or '').strip()
          prop=(os.environ.get('BEDS24_PROP_KEY') or '').strip()
          sha=(os.environ.get('ASSET_COMMIT') or '').strip()
          if not api or not prop or not sha:
              raise SystemExit('Required credentials/asset commit missing')
          print(f'::add-mask::{api}')
          print(f'::add-mask::{prop}')

          manifest=json.loads((ROOT/'aumara-control-tower/evidence/beds24-airbnb-photo-api-sync-20260825-manifest.json').read_text(encoding='utf-8'))
          rows=manifest['records']
          base=f'https://raw.githubusercontent.com/elcidspain/openai-cookbook/{sha}/'
          for row in rows:
              row['url']=base+row['path']
              req=urllib.request.Request(row['url'],headers={'User-Agent':'AUMARA-Control-Tower/1.0'},method='GET')
              with urllib.request.urlopen(req,timeout=60) as r:
                  head=r.read(32)
                  if int(r.status)!=200 or not head:
                      raise SystemExit(f'Hosted image verification failed: {row["path"]}')

          common=sorted([r for r in rows if r['category']=='common'],key=lambda x:x['index'])
          chalet=sorted([r for r in rows if r['category']=='chalet'],key=lambda x:x['index'])
          superior=sorted([r for r in rows if r['category']=='superior'],key=lambda x:x['index'])
          external={}
          slot=1
          for pos,row in enumerate(common,1):
              external[str(slot)]={'url':row['url'],'map':[
                  {'position':str(pos),'propId':'324882','roomId':'674465'},
                  {'position':str(pos),'propId':'324882','roomId':'674466'},
              ]}
              slot+=1
          for offset,row in enumerate(chalet,15):
              external[str(slot)]={'url':row['url'],'map':[{'position':str(offset),'propId':'324882','roomId':'674465'}]}
              slot+=1
          for offset,row in enumerate(superior,15):
              external[str(slot)]={'url':row['url'],'map':[{'position':str(offset),'propId':'324882','roomId':'674466'}]}
              slot+=1
          if len(external)!=18:
              raise SystemExit(f'Expected 18 external slots, got {len(external)}')

          auth={'apiKey':api,'propKey':prop}
          def post(path,payload):
              raw=json.dumps(payload,ensure_ascii=False).encode('utf-8')
              req=urllib.request.Request('https://api.beds24.com/json/'+path,data=raw,headers={'Content-Type':'application/json','Accept':'application/json','User-Agent':'AUMARA-Control-Tower/1.0'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=90) as r:
                      body=r.read(); status=int(r.status)
              except urllib.error.HTTPError as e:
                  body=e.read(); status=int(e.code)
              try: data=json.loads(body.decode('utf-8','replace')) if body else {}
              except Exception: data={'non_json_bytes':len(body)}
              if not 200 <= status < 300:
                  raise SystemExit(f'{path} HTTP {status}: {str(data)[:1200]}')
              return data

          before=post('getPropertyContent',{'authentication':auth,'images':True,'roomIds':True,'includeAirbnb':True})
          time.sleep(5)
          response=post('setPropertyContent',{
              'authentication':auth,
              'setPropertyContent':[{
                  'action':'modify',
                  'images':{'external':external},
                  'roomIds':{
                      '674465':{'airbnb':{'picturesFrom':'rop','publish':'no'}},
                      '674466':{'airbnb':{'picturesFrom':'rop','publish':'no'}},
                  },
              }]
          })
          time.sleep(6)
          after=post('getPropertyContent',{'authentication':auth,'images':True,'roomIds':True,'includeAirbnb':True})
          root=(after.get('getPropertyContent') or [{}])[0]
          actual=((root.get('images') or {}).get('external') or {})
          mismatches=[]
          for key,wanted in external.items():
              got=actual.get(key) or {}
              if got.get('url')!=wanted['url']:
                  mismatches.append({'slot':key,'field':'url','wanted':wanted['url'],'got':got.get('url')})
              wanted_map=sorted(wanted['map'],key=lambda x:(x['roomId'],x['position']))
              got_map=sorted((got.get('map') or []),key=lambda x:(str(x.get('roomId','')),str(x.get('position',''))))
              normalized=[{'position':str(x.get('position','')),'propId':str(x.get('propId','')),'roomId':str(x.get('roomId',''))} for x in got_map]
              if normalized!=wanted_map:
                  mismatches.append({'slot':key,'field':'map','wanted':wanted_map,'got':normalized})
          room_ids=root.get('roomIds') or {}
          room_state={}
          for rid in ('674465','674466'):
              a=((room_ids.get(rid) or {}).get('airbnb') or {})
              room_state[rid]={k:a.get(k) for k in ('listingId','publish','picturesFrom','propertyTypeGroup','listingType')}
              if str(room_state[rid].get('publish') or '').lower()!='no':
                  mismatches.append({'roomId':rid,'field':'publish','wanted':'no','got':room_state[rid].get('publish')})
              if not str(room_state[rid].get('listingId') or '').strip():
                  mismatches.append({'roomId':rid,'field':'listingId','wanted':'present','got':room_state[rid].get('listingId')})

          evidence={
              'schema':'aumara.beds24-airbnb-photo-api-sync.v1',
              'checked_at_utc':dt.datetime.now(dt.timezone.utc).isoformat(),
              'property_id':324882,
              'asset_commit':sha,
              'expected_total':18,
              'slots_written':len(external),
              'room_state':room_state,
              'write_response':response,
              'mismatches':mismatches,
              'status':'SUCCESS' if not mismatches else 'FAILED_READBACK',
              'secret_exposed':False,
          }
          text=json.dumps(evidence,ensure_ascii=False,indent=2,sort_keys=True)
          for secret in (api,prop): text=text.replace(secret,'[REDACTED]')
          out=ROOT/'aumara-control-tower/evidence/beds24-airbnb-photo-api-sync-20260825.json'
          out.write_text(text+'\n',encoding='utf-8')
          subprocess.run(['git','add',str(out)],check=True)
          if subprocess.run(['git','diff','--cached','--quiet'],check=False).returncode!=0:
              subprocess.run(['git','commit','-m',f'Record AUMARA Beds24 photo API sync {evidence["status"]} [skip ci]'],check=True)
              subprocess.run(['git','pull','--rebase','origin','main'],check=True)
              subprocess.run(['git','push','origin','HEAD:main'],check=True)
          print(json.dumps({'status':evidence['status'],'slots_written':18,'room_state':room_state,'mismatch_count':len(mismatches)},ensure_ascii=False))
          if mismatches:
              raise SystemExit(1)
          PY