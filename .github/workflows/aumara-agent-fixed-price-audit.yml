name: AUMARA agent fixed-price audit

on:
  push:
    branches:
      - feat/aumara-ai-agent-rate-20260915
    paths:
      - '.github/workflows/aumara-agent-fixed-price-audit.yml'
      - 'aumara-control-tower/scripts/aumara_agent_fixed_price_audit.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BEDS24_PROPERTIES_TOKEN: ${{ secrets.BEDS24_TOKEN_CREDENTIAL }}
      BEDS24_REFRESH_TOKEN: ${{ secrets.BEDS24_REFRESH_CREDENTIAL }}
    steps:
      - uses: actions/checkout@v4
      - name: Audit AUMARA fixed prices read-only
        run: python aumara-control-tower/scripts/aumara_agent_fixed_price_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aumara-agent-fixed-price-audit
          path: aumara-control-tower/evidence/aumara-agent-fixed-price-audit.json
          retention-days: 2
          if-no-files-found: error
