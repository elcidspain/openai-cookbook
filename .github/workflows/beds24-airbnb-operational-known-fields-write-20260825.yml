name: Beds24 Airbnb operational known fields AUMARA 2026-08-25

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beds24-airbnb-operational-known-fields-write-20260825.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beds24-airbnb-operational-known-fields-324882
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      BEDS24_API_KEY: ${{ secrets.BEDS24_API_KEY }}
      BEDS24_PROP_KEY: ${{ secrets.BEDS24_PROP_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write and verify known Airbnb operational fields
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt, json, os, pathlib, re, subprocess, time, urllib.error, urllib.request

          api=(os.environ.get('BEDS24_API_KEY') or '').strip()
          prop=(os.environ.get('BEDS24_PROP_KEY') or '').strip()
          if not api or not prop: raise SystemExit('Beds24 Production credentials missing')
          print(f'::add-mask::{api}'); print(f'::add-mask::{prop}')
          auth={'apiKey':api,'propKey':prop}
          cfg=json.loads(pathlib.Path('aumara-control-tower/config/airbnb_operational_content_20260825.json').read_text(encoding='utf-8'))

          def post(path,payload):
              req=urllib.request.Request('https://api.beds24.com/json/'+path,data=json.dumps(payload,ensure_ascii=False).encode('utf-8'),headers={'Content-Type':'application/json','Accept':'application/json','User-Agent':'AUMARA-Control-Tower/1.0'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=90) as r: body=r.read(); status=int(r.status)
              except urllib.error.HTTPError as e: body=e.read(); status=int(e.code)
              try: data=json.loads(body.decode('utf-8','replace')) if body else {}
              except Exception: data={'raw':body.decode('utf-8','replace')[:1000]}
              if not 200 <= status < 300: raise SystemExit(f'{path} HTTP {status}: {str(data)[:1500]}')
              return data

          def read_content():
              data=post('getPropertyContent',{'authentication':auth,'bookingData':False,'images':False,'roomIds':True,'texts':True,'includeAirbnb':True,'includeVrbo':False})
              rows=data.get('getPropertyContent') if isinstance(data,dict) else None
              if not isinstance(rows,list) or not rows: raise SystemExit('Unexpected getPropertyContent response')
              return rows[0]

          before=read_content()
          room_map=before.get('roomIds') or {}
          wanted={}
          changes={'action':'modify','roomIds':{}}
          for rid in ('674465','674466'):
              current=room_map.get(rid) or {}
              air=current.get('airbnb') or {}
              custom=str(air.get('custom') or '').strip()
              lines=[line for line in custom.splitlines() if not re.match(r'^\s*CLEANINGFEE\b',line,re.I)]
              lines.append('CLEANINGFEE 20')
              merged_custom='\n'.join(line for line in lines if line.strip())
              room_cfg=cfg['rooms'][rid]
              wanted[rid]={
                  'cleaningFee':'20.00',
                  'checkInText':room_cfg['check_in_instructions'],
                  'houseManualText':room_cfg['house_manual'],
                  'custom':merged_custom,
              }
              changes['roomIds'][rid]={
                  'cleaningFee':'20.00',
                  'airbnb':{
                      'checkInText':room_cfg['check_in_instructions'],
                      'houseManualText':room_cfg['house_manual'],
                      'custom':merged_custom,
                  }
              }

          write_response=post('setPropertyContent',{'authentication':auth,'setPropertyContent':[changes]})
          time.sleep(4)
          after=read_content()
          after_rooms=after.get('roomIds') or {}
          mismatches=[]
          snapshots={}
          for rid,w in wanted.items():
              room=after_rooms.get(rid) or {}; air=room.get('airbnb') or {}
              got={'cleaningFee':str(room.get('cleaningFee') or ''),'checkInText':str(air.get('checkInText') or ''),'houseManualText':str(air.get('houseManualText') or ''),'custom':str(air.get('custom') or '')}
              snapshots[rid]=got
              for key,val in w.items():
                  if got[key] != val: mismatches.append({'roomId':rid,'field':key,'wanted':val,'got':got[key]})

          evidence={'schema':'aumara.beds24-airbnb-operational-known-fields-write.v1','checked_at_utc':dt.datetime.now(dt.timezone.utc).isoformat(),'property_id':324882,'wanted':wanted,'after':snapshots,'write_response':write_response,'mismatches':mismatches,'status':'SUCCESS' if not mismatches else 'FAILED_READBACK','secret_exposed':False}
          text=json.dumps(evidence,ensure_ascii=False,indent=2,sort_keys=True)
          for secret in (api,prop): text=text.replace(secret,'[REDACTED]')
          path=pathlib.Path('aumara-control-tower/evidence/beds24-airbnb-operational-known-fields-write-20260825.json')
          path.parent.mkdir(parents=True,exist_ok=True); path.write_text(text+'\n',encoding='utf-8')
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',str(path)],check=True)
          if subprocess.run(['git','diff','--cached','--quiet'],check=False).returncode != 0:
              subprocess.run(['git','commit','-m',f'Record AUMARA Airbnb operational known fields {evidence["status"]} [skip ci]'],check=True)
              subprocess.run(['git','pull','--rebase','origin','main'],check=True)
              subprocess.run(['git','push','origin','HEAD:main'],check=True)
          print(json.dumps({'status':evidence['status'],'mismatches':mismatches,'after':snapshots},ensure_ascii=False))
          if mismatches: raise SystemExit(1)
          PY