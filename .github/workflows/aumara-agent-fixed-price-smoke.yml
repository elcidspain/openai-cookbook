name: AUMARA agent fixed-price smoke

on:
  push:
    branches:
      - feat/aumara-ai-agent-rate-20260915
    paths:
      - '.github/workflows/aumara-agent-fixed-price-smoke.yml'
      - 'aumara-control-tower/scripts/aumara_agent_fixed_price_smoke.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      BEDS24_PROPERTIES_TOKEN: ${{ secrets.BEDS24_TOKEN_CREDENTIAL }}
      BEDS24_REFRESH_TOKEN: ${{ secrets.BEDS24_REFRESH_CREDENTIAL }}
    steps:
      - uses: actions/checkout@v4
      - name: Prove agent-only Fixed Price path and return controls to dormant
        run: python aumara-control-tower/scripts/aumara_agent_fixed_price_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aumara-agent-fixed-price-smoke
          path: aumara-control-tower/evidence/aumara-agent-fixed-price-smoke.json
          retention-days: 2
          if-no-files-found: error
