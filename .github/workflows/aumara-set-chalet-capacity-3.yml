name: AUMARA Set Chalet Capacity 3

# Approved single change: Chalet room 674465 (property 324882) maxPeople=3, maxAdult=3.
# Nothing else is written. Manual dispatch only. No repo commits.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aumara-property-write-324882
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: Production
    env:
      BEDS24_API_KEY: ${{ secrets.BEDS24_API_KEY }}
      BEDS24_PROP_KEY: ${{ secrets.BEDS24_PROP_KEY }}
    steps:
      - name: Set Chalet guest capacity to 3 and verify
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os, time, urllib.error, urllib.request

          ROOM_ID="674465"; PROP_ID="324882"; TARGET="3"
          api=(os.environ.get("BEDS24_API_KEY") or "").strip()
          prop=(os.environ.get("BEDS24_PROP_KEY") or "").strip()
          if not (api and prop): raise SystemExit("Missing Beds24 Production API/PROP keys")
          print(f"::add-mask::{api}"); print(f"::add-mask::{prop}")
          auth={"authentication":{"apiKey":api,"propKey":prop}}
          ev={"status":"RUNNING","checkedAtUtc":dt.datetime.now(dt.timezone.utc).isoformat()}
          import atexit; atexit.register(lambda: print("EVIDENCE:\n"+json.dumps(ev,indent=2,ensure_ascii=False,default=str)))
          KEYS=["roomId","name","qty","maxPeople","maxAdult","maxChildren","bookingComRoomCode","bookingComRateCode","airbnbRoomCode"]

          def call(path,payload,auth_on=True):
              body=dict(payload)
              if auth_on: body.update(auth)
              req=urllib.request.Request(f"https://api.beds24.com/json/{path}",data=json.dumps(body).encode(),
                  headers={"Content-Type":"application/json","Accept":"application/json","User-Agent":"AUMARA-capacity-fix/1.1"},method="POST")
              try:
                  with urllib.request.urlopen(req,timeout=90) as r: raw=r.read(); st=int(r.status)
              except urllib.error.HTTPError as e: raw=e.read(); st=int(e.code)
              try: data=json.loads(raw.decode("utf-8","replace")) if raw else {}
              except Exception: data={"raw":raw.decode("utf-8","replace")[:1000]}
              time.sleep(2.2)
              if not 200 <= st < 300: raise RuntimeError(f"{path} HTTP {st}: {data}")
              return data

          def get_room():
              raw=call("getProperty",{"includeRooms":True,"includeRoomUnits":True,"includeAccountAccess":False})
              props=raw.get("getProperty",[]) if isinstance(raw,dict) else []
              if not props: raise RuntimeError("getProperty missing property")
              room=next((x for x in props[0].get("roomTypes",[]) if str(x.get("roomId"))==ROOM_ID),None)
              if not room: raise RuntimeError("Chalet room not found")
              return room

          def room_dates():
              # Read-only inventory/price/min-stay snapshot (best effort)
              try:
                  return call("getRoomDates",{"roomId":ROOM_ID,"from":"20261001","to":"20261231"})
              except Exception as e:
                  return {"error":str(e)[:300]}

          def quote(n):
              q=call("getAvailabilities",{"checkIn":"20261015","checkOut":"20261017","propId":PROP_ID,
                  "numAdult":str(n),"numChild":"0","ignoreAvail":True},auth_on=False)
              return q.get(ROOM_ID,{}) if isinstance(q,dict) else {}

          before=get_room()
          ev["before"]={k:before.get(k) for k in KEYS}
          if str(before.get("qty"))!="4": raise RuntimeError(f"Safety gate: Chalet qty is {before.get('qty')}, expected 4")
          if str(before.get("name"))!="Chalet": raise RuntimeError(f"Safety gate: unexpected room name {before.get('name')}")
          dates_before=room_dates()
          quote2_before=quote(2)

          if str(before.get("maxPeople"))==TARGET and str(before.get("maxAdult"))==TARGET:
              ev["write"]="SKIPPED_ALREADY_AT_TARGET"
          else:
              ev["writeResponse"]=call("setProperty",{"setProperty":[{"action":"modify","roomTypes":[{
                  "action":"modify","roomId":ROOM_ID,"maxPeople":TARGET,"maxAdult":TARGET}]}]})

          after=get_room()
          ev["after"]={k:after.get(k) for k in KEYS}
          if str(after.get("maxPeople"))!=TARGET or str(after.get("maxAdult"))!=TARGET:
              raise RuntimeError(f"Read-back failed: {ev['after']}")
          # Full room object diff: only maxPeople/maxAdult may differ
          diffs={k:[before.get(k),after.get(k)] for k in set(before)|set(after)
                 if k not in ("maxPeople","maxAdult") and json.dumps(before.get(k),sort_keys=True)!=json.dumps(after.get(k),sort_keys=True)}
          ev["otherRoomFieldDiffs"]=diffs
          if str(after.get("qty"))!="4": raise RuntimeError(f"Units changed: qty={after.get('qty')}")

          dates_after=room_dates()
          ev["roomDatesUnchanged"]=(json.dumps(dates_before,sort_keys=True)==json.dumps(dates_after,sort_keys=True))
          ev["roomDatesError"]=dates_before.get("error") if isinstance(dates_before,dict) else None
          ev["roomDatesSample"]={k:dates_before[k] for k in list(dates_before)[:5]} if isinstance(dates_before,dict) else None
          quote2_after=quote(2)
          ev["quote2Adults"]={"before":quote2_before,"after":quote2_after}
          ev["quote3Adults"]=quote(3)
          ev["quote4Adults"]=quote(4)
          if ev["quote3Adults"].get("price") is None: raise RuntimeError("3-adult Chalet quote has no price")
          if quote2_before.get("price")!=quote2_after.get("price"): raise RuntimeError("2-adult price changed")
          if diffs: raise RuntimeError(f"Unexpected room field changes: {diffs}")
          if not ev["roomDatesUnchanged"]: raise RuntimeError("Room dates (inventory/prices) snapshot changed")
          ev["status"]="SUCCESS"
          PY
