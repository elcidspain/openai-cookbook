name: Beds24 Airbnb Chalet multi-inventory classification 2026-08-26

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beds24-airbnb-draft-prepare-20260825.yml'

permissions:
  contents: read

concurrency:
  group: beds24-airbnb-draft-prepare-324882
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production
    env:
      BEDS24_API_KEY: ${{ secrets.BEDS24_API_KEY }}
      BEDS24_PROP_KEY: ${{ secrets.BEDS24_PROP_KEY }}
    steps:
      - name: Fix Chalet multi-inventory Airbnb type and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, time, urllib.error, urllib.request
          api=(os.environ.get('BEDS24_API_KEY') or '').strip(); prop=(os.environ.get('BEDS24_PROP_KEY') or '').strip()
          if not api or not prop: raise SystemExit('Beds24 V1 content credentials missing in Production')
          print(f'::add-mask::{api}'); print(f'::add-mask::{prop}'); auth={'apiKey':api,'propKey':prop}
          def post(path,payload):
              req=urllib.request.Request('https://api.beds24.com/json/'+path,data=json.dumps(payload,ensure_ascii=False).encode('utf-8'),headers={'Content-Type':'application/json','Accept':'application/json','User-Agent':'AUMARA-Control-Tower/1.0'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=60) as r: body=r.read(); status=int(r.status)
              except urllib.error.HTTPError as e: body=e.read(); status=int(e.code)
              data=json.loads(body.decode('utf-8','replace')) if body else {}
              if not 200 <= status < 300: raise SystemExit(f'{path} HTTP {status}: {str(data)[:1200]}')
              return data
          def read_content():
              rows=(post('getPropertyContent',{'authentication':auth,'bookingData':False,'images':False,'roomIds':True,'texts':True,'includeAirbnb':True,'includeVrbo':False}).get('getPropertyContent') or [])
              if not rows: raise SystemExit('Unexpected getPropertyContent response')
              return rows[0]
          rid='674465'; before=read_content(); room=((before.get('roomIds') or {}).get(rid) or {}); air=room.get('airbnb') or {}; qty=str(room.get('qty') or '')
          if qty and int(float(qty)) <= 1: raise SystemExit(f'Expected multi-inventory Chalet, got qty={qty}')
          lines=[ln.strip() for ln in str(air.get('custom') or '').splitlines() if ln.strip() and not re.match(r'^PROPERTYTYPE\s+',ln,re.I)]
          lines.append('PROPERTYTYPE pension')
          wanted={'propertyTypeGroup':'boutique_hotels_and_more','listingType':'private_room','picturesFrom':'r','publish':'yes','custom':'\n'.join(lines)}
          wr=post('setPropertyContent',{'authentication':auth,'setPropertyContent':[{'action':'modify','roomIds':{rid:{'airbnb':wanted}}}]})
          time.sleep(5); after=read_content(); got=(((after.get('roomIds') or {}).get(rid) or {}).get('airbnb') or {})
          mismatches={k:{'wanted':v,'got':got.get(k)} for k,v in wanted.items() if str(got.get(k) or '').strip().lower()!=str(v).strip().lower()}
          print(json.dumps({'status':'SUCCESS' if not mismatches else 'FAILED_READBACK','roomId':rid,'qty':qty,'listingId':got.get('listingId'),'after':{k:got.get(k) for k in wanted},'mismatches':mismatches,'write_response':wr},ensure_ascii=False))
          if mismatches: raise SystemExit(1)
          PY
