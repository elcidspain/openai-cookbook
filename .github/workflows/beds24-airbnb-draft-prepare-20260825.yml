name: Beds24 Airbnb draft prepare AUMARA 2026-08-25

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beds24-airbnb-draft-prepare-20260825.yml'

permissions:
  contents: write

concurrency:
  group: beds24-airbnb-draft-prepare-324882
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      BEDS24_API_KEY: ${{ secrets.BEDS24_API_KEY }}
      BEDS24_PROP_KEY: ${{ secrets.BEDS24_PROP_KEY }}
      PROPERTY_ID: '324882'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set unpublished Airbnb multi-inventory content and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt, json, os, pathlib, subprocess, time, urllib.error, urllib.request

          api=(os.environ.get('BEDS24_API_KEY') or '').strip()
          prop=(os.environ.get('BEDS24_PROP_KEY') or '').strip()
          pid=int(os.environ.get('PROPERTY_ID','324882'))
          if not api or not prop:
              raise SystemExit('Beds24 V1 content credentials missing in Production')
          print(f'::add-mask::{api}')
          print(f'::add-mask::{prop}')
          auth={'apiKey':api,'propKey':prop}

          def post(path,payload):
              raw=json.dumps(payload,ensure_ascii=False).encode('utf-8')
              req=urllib.request.Request(
                  'https://api.beds24.com/json/'+path,
                  data=raw,
                  headers={'Content-Type':'application/json','Accept':'application/json','User-Agent':'AUMARA-Control-Tower/1.0'},
                  method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=90) as r:
                      body=r.read(); status=int(r.status)
              except urllib.error.HTTPError as e:
                  body=e.read(); status=int(e.code)
              try: data=json.loads(body.decode('utf-8','replace')) if body else {}
              except Exception: data={'non_json_bytes':len(body)}
              if not 200 <= status < 300:
                  raise SystemExit(f'{path} HTTP {status}: {str(data)[:1500]}')
              return data

          room_ids=('674465','674466')
          wanted={
              rid:{
                  'propertyTypeGroup':'boutique_hotels_and_more',
                  'listingType':'entire_home',
                  'publish':'no'
              } for rid in room_ids
          }

          def read_content():
              data=post('getPropertyContent',{
                  'authentication':auth,
                  'bookingData':False,
                  'images':False,
                  'roomIds':True,
                  'texts':True,
                  'includeAirbnb':True,
                  'includeVrbo':False
              })
              rows=data.get('getPropertyContent') if isinstance(data,dict) else None
              if not isinstance(rows,list) or not rows or not isinstance(rows[0],dict):
                  raise SystemExit('Unexpected getPropertyContent response')
              return rows[0]

          before=read_content()
          before_airbnb={rid:((before.get('roomIds') or {}).get(rid) or {}).get('airbnb',{}) for rid in room_ids}

          changes={
              'action':'modify',
              'roomIds':{
                  rid:{'airbnb':wanted[rid]} for rid in room_ids
              }
          }
          response=post('setPropertyContent',{'authentication':auth,'setPropertyContent':[changes]})
          time.sleep(4)
          after=read_content()
          after_airbnb={rid:((after.get('roomIds') or {}).get(rid) or {}).get('airbnb',{}) for rid in room_ids}

          mismatches=[]
          for rid in room_ids:
              for key,val in wanted[rid].items():
                  got=after_airbnb[rid].get(key)
                  if str(got).lower()!=str(val).lower():
                      mismatches.append({'roomId':rid,'field':key,'wanted':val,'got':got})

          evidence={
              'schema':'aumara.beds24-airbnb-draft-prepare.v1',
              'property_id':pid,
              'checked_at_utc':dt.datetime.now(dt.timezone.utc).isoformat(),
              'decision':{
                  'propertyTypeGroup':'boutique_hotels_and_more',
                  'reason':'Airbnb room-type inventory supports multiple interchangeable units; House is not eligible. AUMARA rooms are pooled multi-unit room types.',
                  'publish':'no'
              },
              'before':{rid:{k:before_airbnb[rid].get(k) for k in ('propertyTypeGroup','listingType','publish','listingId')} for rid in room_ids},
              'wanted':wanted,
              'after':{rid:{k:after_airbnb[rid].get(k) for k in ('propertyTypeGroup','listingType','publish','listingId')} for rid in room_ids},
              'write_response':response,
              'mismatches':mismatches,
              'status':'SUCCESS' if not mismatches else 'FAILED_READBACK',
              'secret_exposed':False
          }
          text=json.dumps(evidence,ensure_ascii=False,indent=2,sort_keys=True)
          for secret in (api,prop): text=text.replace(secret,'[REDACTED]')
          path=pathlib.Path('aumara-control-tower/evidence/beds24-airbnb-draft-prepare-20260825.json')
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(text+'\n',encoding='utf-8')

          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',str(path)],check=True)
          if subprocess.run(['git','diff','--cached','--quiet'],check=False).returncode != 0:
              subprocess.run(['git','commit','-m',f'Record AUMARA Airbnb draft prepare {evidence["status"]} [skip ci]'],check=True)
              subprocess.run(['git','pull','--rebase','origin','main'],check=True)
              subprocess.run(['git','push','origin','HEAD:main'],check=True)

          print(json.dumps({'status':evidence['status'],'after':evidence['after'],'mismatches':mismatches},ensure_ascii=False))
          if mismatches:
              raise SystemExit(1)
          PY