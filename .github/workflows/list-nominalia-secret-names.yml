name: List available secret names safely

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/list-nominalia-secret-names.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    environment: NOMINALIA_FTP_PASSWORD
    env:
      SECRET_JSON: ${{ toJSON(secrets) }}
    steps:
      - name: Print secret names only
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          data=json.loads(os.environ.get('SECRET_JSON') or '{}')
          print(json.dumps(sorted(data.keys())))
          PY
