name: Probe current RealitySift provider credential slots safely

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-realitysift-provider-slots-current.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: NOMINALIA_FTP_PASSWORD
    env:
      S_NOMINALIAFTPPASSWORD: ${{ secrets.NOMINALIAFTPPASSWORD }}
      S_NOMINALIA_FTP_PASSWORD: ${{ secrets.NOMINALIA_FTP_PASSWORD }}
      S_NOMINALIA_PASSWORD: ${{ secrets.NOMINALIA_PASSWORD }}
      S_NOMINALIAPASSWORD: ${{ secrets.NOMINALIAPASSWORD }}
      S_NOMINALIA_PASS: ${{ secrets.NOMINALIA_PASS }}
      S_NOMINALIAPASS: ${{ secrets.NOMINALIAPASS }}
      S_NOMINALIA_CONTROL_PASSWORD: ${{ secrets.NOMINALIA_CONTROL_PASSWORD }}
      S_NOMINALIACONTROLPASSWORD: ${{ secrets.NOMINALIACONTROLPASSWORD }}
      S_NOMINALIA_PANEL_PASSWORD: ${{ secrets.NOMINALIA_PANEL_PASSWORD }}
      S_NOMINALIAPANELPASSWORD: ${{ secrets.NOMINALIAPANELPASSWORD }}
      S_NOMINALIA_TOKEN: ${{ secrets.NOMINALIA_TOKEN }}
      S_NOMINALIATOKEN: ${{ secrets.NOMINALIATOKEN }}
      S_NOMINALIA_API_TOKEN: ${{ secrets.NOMINALIA_API_TOKEN }}
      S_NOMINALIA_API_KEY: ${{ secrets.NOMINALIA_API_KEY }}
      S_NOMINALIA_DNS_TOKEN: ${{ secrets.NOMINALIA_DNS_TOKEN }}
      S_NOMINALIA_DNS_API_TOKEN: ${{ secrets.NOMINALIA_DNS_API_TOKEN }}
      S_NOMINALIA_DNS_API_KEY: ${{ secrets.NOMINALIA_DNS_API_KEY }}
      S_TEAMBLUE_TOKEN: ${{ secrets.TEAMBLUE_TOKEN }}
      S_TEAMBLUE_API_TOKEN: ${{ secrets.TEAMBLUE_API_TOKEN }}
      S_TEAMBLUE_API_KEY: ${{ secrets.TEAMBLUE_API_KEY }}
      S_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      S_VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      S_VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      VARS_JSON: ${{ toJSON(vars) }}
    steps:
      - name: Report names and presence only
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          present=sorted(k[2:] for k,v in os.environ.items() if k.startswith('S_') and v)
          try:
              variables=sorted(json.loads(os.environ.get('VARS_JSON') or '{}').keys())
          except Exception:
              variables=[]
          relevant=[v for v in variables if any(x in v.upper() for x in ('NOMINALIA','TEAMBLUE','VERCEL','DOMAIN','DNS','REGISTRAR'))]
          print(json.dumps({'secret_names_present':present,'relevant_variable_names':relevant},sort_keys=True))
          PY
