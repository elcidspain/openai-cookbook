name: Beds24 AUMARA agent rate read-only audit

on:
  push:
    branches:
      - exo/aumara-agent-rate-20260915
    paths:
      - 'aumara-control-tower/scripts/beds24_agent_rate_audit.py'
      - '.github/workflows/beds24-agent-rate-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beds24-agent-rate-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      BEDS24_VAULT_KEK: ${{ secrets.BEDS24_REFRESH_CREDENTIAL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Install vault dependency
        run: python -m pip install --disable-pip-version-check cryptography

      - name: Read Beds24 pricing and offers
        run: python aumara-control-tower/scripts/beds24_agent_rate_audit.py

      - name: Commit sanitized audit evidence to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aumara-control-tower/evidence/beds24-agent-rate-audit-20260915.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record Beds24 agent rate read-only audit [skip ci]'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
