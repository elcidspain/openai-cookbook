name: Beds24 Airbnb post-export audit AUMARA 2026-08-25

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beds24-airbnb-post-export-audit-20260825.yml'

permissions:
  contents: write

concurrency:
  group: beds24-airbnb-post-export-audit-324882
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      BEDS24_API_KEY: ${{ secrets.BEDS24_API_KEY }}
      BEDS24_PROP_KEY: ${{ secrets.BEDS24_PROP_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read back exported Airbnb listings without modifying channel state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt, json, os, pathlib, subprocess, urllib.error, urllib.request

          api=(os.environ.get('BEDS24_API_KEY') or '').strip()
          prop=(os.environ.get('BEDS24_PROP_KEY') or '').strip()
          if not api or not prop:
              raise SystemExit('Beds24 V1 content credentials missing in Production')
          print(f'::add-mask::{api}')
          print(f'::add-mask::{prop}')

          payload=json.dumps({
              'authentication':{'apiKey':api,'propKey':prop},
              'bookingData':False,
              'images':False,
              'roomIds':True,
              'texts':True,
              'includeAirbnb':True,
              'includeVrbo':False
          }).encode()
          req=urllib.request.Request(
              'https://api.beds24.com/json/getPropertyContent',
              data=payload,
              headers={'Content-Type':'application/json','Accept':'application/json'},
              method='POST')
          try:
              with urllib.request.urlopen(req,timeout=90) as r:
                  body=r.read(); status=int(r.status)
          except urllib.error.HTTPError as e:
              body=e.read(); status=int(e.code)
          try: data=json.loads(body.decode('utf-8','replace')) if body else {}
          except Exception: data={}
          if not 200 <= status < 300:
              raise SystemExit(f'getPropertyContent HTTP {status}: {str(data)[:1000]}')

          rows=data.get('getPropertyContent') if isinstance(data,dict) else None
          if not isinstance(rows,list) or not rows or not isinstance(rows[0],dict):
              raise SystemExit('Unexpected getPropertyContent response')
          root=rows[0]

          room_state={}
          blockers=[]
          for rid in ('674465','674466'):
              room=((root.get('roomIds') or {}).get(rid) or {})
              airbnb=room.get('airbnb') or {}
              state={
                  'listingId':airbnb.get('listingId'),
                  'publish':airbnb.get('publish'),
                  'propertyTypeGroup':airbnb.get('propertyTypeGroup'),
                  'listingType':airbnb.get('listingType'),
                  'priceStrategy':airbnb.get('priceStategy'),
                  'cancellationPolicy':airbnb.get('cancellationPolicy'),
                  'discountDays2':airbnb.get('discountDays2'),
                  'discountDays3':airbnb.get('discountDays3'),
                  'discountDays4':airbnb.get('discountDays4'),
                  'discountDays5':airbnb.get('discountDays5'),
                  'discountDays6':airbnb.get('discountDays6'),
                  'discountDays7':airbnb.get('discountDays7'),
                  'discountDays14':airbnb.get('discountDays14'),
                  'discountDays21':airbnb.get('discountDays21'),
                  'discountDays28':airbnb.get('discountDays28'),
                  'discountWeekly':airbnb.get('discountWeekly'),
                  'discountMonthly':airbnb.get('discountMonthly')
              }
              room_state[rid]=state
              if not str(state['listingId'] or '').strip(): blockers.append({'roomId':rid,'field':'listingId','got':state['listingId']})
              if str(state['publish']).lower()!='no': blockers.append({'roomId':rid,'field':'publish','got':state['publish']})
              if str(state['propertyTypeGroup']).lower()!='boutique_hotels_and_more': blockers.append({'roomId':rid,'field':'propertyTypeGroup','got':state['propertyTypeGroup']})
              if str(state['listingType']).lower()!='entire_home': blockers.append({'roomId':rid,'field':'listingType','got':state['listingType']})

          evidence={
              'schema':'aumara.beds24-airbnb-post-export-audit.v2',
              'checked_at_utc':dt.datetime.now(dt.timezone.utc).isoformat(),
              'property_id':324882,
              'room_state':room_state,
              'blockers':blockers,
              'status':'SUCCESS' if not blockers else 'BLOCKED',
              'secret_exposed':False
          }
          text=json.dumps(evidence,ensure_ascii=False,indent=2,sort_keys=True)
          for secret in (api,prop): text=text.replace(secret,'[REDACTED]')
          out=pathlib.Path('aumara-control-tower/evidence/beds24-airbnb-post-export-audit-20260825.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(text+'\n',encoding='utf-8')

          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',str(out)],check=True)
          if subprocess.run(['git','diff','--cached','--quiet'],check=False).returncode != 0:
              subprocess.run(['git','commit','-m',f'Record AUMARA Airbnb post-export audit {evidence["status"]} [skip ci]'],check=True)
              subprocess.run(['git','pull','--rebase','origin','main'],check=True)
              subprocess.run(['git','push','origin','HEAD:main'],check=True)

          print(json.dumps({'status':evidence['status'],'room_state':room_state,'blockers':blockers},ensure_ascii=False))
          if blockers:
              raise SystemExit(2)
          PY