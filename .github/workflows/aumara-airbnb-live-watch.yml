name: AUMARA Airbnb live watch

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  watch:
    if: github.event.issue.number == 83 && contains(github.event.comment.body, '/airbnb-live-watch')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for both Airbnb listings to become public
        shell: bash
        run: |
          set -euo pipefail
          CHALET='https://www.airbnb.com/rooms/1759764557896676605'
          SUPERIOR='https://www.airbnb.com/rooms/1759764847919085354'

          for attempt in $(seq 1 20); do
            chalet_code=$(curl -A 'Mozilla/5.0' -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "$CHALET" || true)
            superior_code=$(curl -A 'Mozilla/5.0' -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "$SUPERIOR" || true)
            echo "attempt=${attempt} chalet=${chalet_code} superior=${superior_code}"

            if [[ "$chalet_code" == '200' && "$superior_code" == '200' ]]; then
              echo 'Both Airbnb listings are public.'
              exit 0
            fi

            sleep 30
          done

          echo 'Timed out waiting for both Airbnb listings to return HTTP 200.' >&2
          exit 1

      - name: Record live cutover on issue 83
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 83 --repo "$GITHUB_REPOSITORY" --body $'Airbnb live cutover VERIFIED by automated public endpoint watch:\n\n- Chalet 1759764557896676605: HTTP 200\n- Superior Chalet 1759764847919085354: HTTP 200\n- Both listings are publicly reachable.\n\nAUMARA Airbnb cutover is complete.'
