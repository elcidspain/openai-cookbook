name: AUMARA Airbnb live watch

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  watch:
    if: github.event.issue.number == 83 && contains(github.event.comment.body, '/airbnb-live-watch')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Observe public Airbnb endpoints without declaring listing state
        shell: bash
        run: |
          set -euo pipefail
          CHALET='https://www.airbnb.com/rooms/1759764557896676605'
          SUPERIOR='https://www.airbnb.com/rooms/1759764847919085354'

          for attempt in $(seq 1 20); do
            chalet_code=$(curl -A 'Mozilla/5.0' -L -sS -o /tmp/chalet.html -w '%{http_code}' --max-time 20 "$CHALET" || true)
            superior_code=$(curl -A 'Mozilla/5.0' -L -sS -o /tmp/superior.html -w '%{http_code}' --max-time 20 "$SUPERIOR" || true)
            echo "attempt=${attempt} chalet_http=${chalet_code} superior_http=${superior_code}"

            # HTTP 200 alone is NOT proof that Airbnb has published a listing.
            # Airbnb can serve an application shell for a listing still marked In progress.
            # Canonical publication truth is the authenticated Airbnb host listing state.
            sleep 30
          done

          echo 'Endpoint observation complete; authenticated host status is required for LIVE verification.'

      - name: Record observation only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 83 --repo "$GITHUB_REPOSITORY" --body $'Airbnb endpoint observation completed. HTTP status is informational only and is no longer treated as proof of publication. Canonical LIVE gate: authenticated Airbnb host listing state must show **Listed** for both AUMARA listings. Do not close this issue while either listing shows **In progress**.'
