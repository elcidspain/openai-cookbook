name: Probe additional Nominalia credential slots safely

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-nominalia-more-secret-slots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: NOMINALIA_FTP_PASSWORD
    env:
      S_CLIENT_PASSWORD: ${{ secrets.NOMINALIA_CLIENT_PASSWORD }}
      S_LOGIN_PASSWORD: ${{ secrets.NOMINALIA_LOGIN_PASSWORD }}
      S_CONTROLPANEL_PASSWORD: ${{ secrets.NOMINALIA_CONTROLPANEL_PASSWORD }}
      S_CONTROL_PANEL_PASSWORD: ${{ secrets.NOMINALIA_CONTROL_PANEL_PASSWORD }}
      S_ADMIN_PASSWORD: ${{ secrets.NOMINALIA_ADMIN_PASSWORD }}
      S_AUTH_TOKEN: ${{ secrets.NOMINALIA_AUTH_TOKEN }}
      S_ACCESS_TOKEN: ${{ secrets.NOMINALIA_ACCESS_TOKEN }}
      S_BEARER_TOKEN: ${{ secrets.NOMINALIA_BEARER_TOKEN }}
      S_KEY: ${{ secrets.NOMINALIA_KEY }}
      S_CLIENT_ID: ${{ secrets.NOMINALIA_CLIENT_ID }}
      S_CLIENT_SECRET: ${{ secrets.NOMINALIA_CLIENT_SECRET }}
      S_TEAMBLUE_TOKEN: ${{ secrets.TEAMBLUE_TOKEN }}
      S_TEAMBLUE_API_TOKEN: ${{ secrets.TEAMBLUE_API_TOKEN }}
      S_TEAMBLUE_KEY: ${{ secrets.TEAMBLUE_KEY }}
      S_TB_TOKEN: ${{ secrets.TB_TOKEN }}
      S_TB_API_TOKEN: ${{ secrets.TB_API_TOKEN }}
      S_TB_API_KEY: ${{ secrets.TB_API_KEY }}
      S_DOMAIN_TOKEN: ${{ secrets.DOMAIN_TOKEN }}
      S_DOMAIN_API_TOKEN: ${{ secrets.DOMAIN_API_TOKEN }}
      S_DOMAIN_API_KEY: ${{ secrets.DOMAIN_API_KEY }}
      S_REGISTRAR_TOKEN: ${{ secrets.REGISTRAR_TOKEN }}
      S_REGISTRAR_API_TOKEN: ${{ secrets.REGISTRAR_API_TOKEN }}
      S_REGISTRAR_API_KEY: ${{ secrets.REGISTRAR_API_KEY }}
      S_PANEL_TOKEN: ${{ secrets.NOMINALIA_PANEL_TOKEN }}
      S_CONTROL_TOKEN: ${{ secrets.NOMINALIA_CONTROL_TOKEN }}
      S_WEBCONTROL_TOKEN: ${{ secrets.NOMINALIA_WEBCONTROL_TOKEN }}
      S_ACCOUNT_TOKEN: ${{ secrets.NOMINALIA_ACCOUNT_TOKEN }}
      S_ACCOUNT_PASSWORD: ${{ secrets.NOMINALIA_ACCOUNT_PASSWORD }}
      S_CUSTOMER_PASSWORD: ${{ secrets.NOMINALIA_CUSTOMER_PASSWORD }}
      S_CUSTOMER_TOKEN: ${{ secrets.NOMINALIA_CUSTOMER_TOKEN }}
      S_API_SECRET: ${{ secrets.NOMINALIA_API_SECRET }}
      S_DNS_TOKEN: ${{ secrets.NOMINALIA_DNS_TOKEN }}
      S_DNS_API_KEY: ${{ secrets.NOMINALIA_DNS_API_KEY }}
      S_DNS_API_TOKEN: ${{ secrets.NOMINALIA_DNS_API_TOKEN }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          out={k[2:]: bool(v) for k,v in os.environ.items() if k.startswith('S_')}
          print(json.dumps(out,sort_keys=True))
          PY
