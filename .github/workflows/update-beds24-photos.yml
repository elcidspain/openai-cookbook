name: Update Beds24 Photos AUMARA 324882

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beds24-photos-324882
  cancel-in-progress: true

jobs:
  update-photos:
    name: Upload 10 approved photos to property 324882
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: Production
    env:
      BEDS24_API_KEY: ${{ secrets.BEDS24_API_KEY }}
      BEDS24_PROP_KEY: ${{ secrets.BEDS24_PROP_KEY }}
      PROPERTY_ID: "324882"
    steps:
      - name: Authenticate V1, download 10 photos, upload to Beds24
        id: transfer
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import base64, datetime as dt, hashlib, http.cookiejar, json, os, pathlib, re, sys, urllib.error, urllib.parse, urllib.request, uuid
          from typing import Any

          PROPERTY_ID = os.environ.get("PROPERTY_ID", "324882")
          WORK = pathlib.Path(os.environ.get("RUNNER_TEMP", "/tmp")) / "beds24-324882-v1"
          WORK.mkdir(parents=True, exist_ok=True)
          EVIDENCE_PATH = WORK / "evidence.json"
          DOWNLOAD_DIR = WORK / "photos"
          TIMEOUT = 90
          MAX_IMAGE_BYTES = 15_000_000

          PHOTO_MANIFEST = [
              ("01_FULL_no_crop.jpg", "1MAcqpC0veE8DNJuQvViQzCvUqwnlKbY_"),
              ("02_FULL_no_crop.jpg", "19jTCi6FThY584Iebs4vvlPujojSdudQD"),
              ("03_FULL_no_crop.jpg", "1WHAIG1Pz7w0rUwciC7O5dAMbB7WSEKKd"),
              ("04_FULL_no_crop.jpg", "1robOjhdVs12hp6XLbD5AuJsjW84bCxBc"),
              ("06_FULL_no_crop.jpg", "13c7-i9mzpIpX2JJnyyB406T9jp7EMFmV"),
              ("IMG_0005.JPG", "1Cg4Y-skeJ6VNAnfsRPwPEED9RlQ8IIlV"),
              ("IMG_0006.JPG", "1UJaAE4Z9DpVFi67xAG7iZ33l4_xMUS9o"),
              ("IMG_0007.JPG", "17Amun9sFTFpogCN459bhysRkgKCSaMo1"),
              ("IMG_0009.JPG", "1z80jRlJkLwdLkZlLlGv1zNB4i79JhSh8"),
              ("IMG_0011.JPG", "1cqP3azFyywT0jcNO8SfNbQ8lMAoOAtMj"),
          ]

          api_key = (os.environ.get("BEDS24_API_KEY") or "").strip().strip('"').strip("'")
          prop_key = (os.environ.get("BEDS24_PROP_KEY") or "").strip().strip('"').strip("'")

          def mask(v: str):
              if v: print(f"::add-mask::{v}", flush=True)
          mask(api_key); mask(prop_key)

          evidence: dict[str, Any] = {
              "checked_at_utc": dt.datetime.now(dt.timezone.utc).isoformat(),
              "property_id": PROPERTY_ID,
              "auth_mode": "api_prop_keys",
              "credential_present": bool(api_key and prop_key),
              "downloaded_files": [],
              "write_attempts": [],
              "picture_count_before": None,
              "picture_count_after": None,
          }

          def save_evidence():
              EVIDENCE_PATH.write_text(json.dumps(evidence, indent=2, ensure_ascii=False)+"\n", encoding="utf-8")

          def fail(stage, msg):
              evidence["status"]="FAILED"; evidence["failure_stage"]=stage; evidence["diagnostic"]=msg; save_evidence()
              print(f"ERROR [{stage}]: {msg}", file=sys.stderr); raise SystemExit(1)

          def request_json(url, payload):
              data=json.dumps(payload).encode()
              req=urllib.request.Request(url, data=data, headers={"Content-Type":"application/json","Accept":"application/json","User-Agent":"AUMARA-V1/1.0"}, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=TIMEOUT) as r:
                      raw=r.read(); status=int(r.status)
              except urllib.error.HTTPError as e:
                  raw=e.read(); status=int(e.code)
              try:
                  body=json.loads(raw.decode('utf-8','replace')) if raw else {}
              except:
                  body={}
              return status, body

          def download_drive_file(file_id: str, dest: pathlib.Path):
              cj=http.cookiejar.CookieJar()
              opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
              urls=[
                  f"https://drive.usercontent.google.com/download?id={urllib.parse.quote(file_id)}&export=download&confirm=t",
                  f"https://drive.google.com/uc?export=download&id={urllib.parse.quote(file_id)}&confirm=t",
              ]
              for url in urls:
                  try:
                      with opener.open(urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"}), timeout=TIMEOUT) as resp:
                          raw=resp.read(MAX_IMAGE_BYTES+1)
                      if len(raw)>100_000 and raw.startswith(b"\xff\xd8\xff"):
                          dest.write_bytes(raw); return
                      text=raw[:5000].decode("utf-8","ignore")
                      m=re.search(r"confirm=([0-9A-Za-z_-]+)", text)
                      if m:
                          retry=f"https://drive.google.com/uc?export=download&id={urllib.parse.quote(file_id)}&confirm={urllib.parse.quote(m.group(1))}"
                          with opener.open(urllib.request.Request(retry, headers={"User-Agent":"Mozilla/5.0"}), timeout=TIMEOUT) as resp:
                              raw2=resp.read(MAX_IMAGE_BYTES+1)
                          if len(raw2)>100_000 and raw2.startswith(b"\xff\xd8\xff"):
                              dest.write_bytes(raw2); return
                  except Exception as e:
                      continue
              raise RuntimeError("Google Drive download failed")

          if not api_key or not prop_key:
              fail("credential","BEDS24_API_KEY or BEDS24_PROP_KEY empty in Production secrets")

          # BEFORE count via getPropertyContent V1
          status, body = request_json("https://api.beds24.com/json/getPropertyContent", {"authentication":{"apiKey":api_key,"propKey":prop_key},"propId":int(PROPERTY_ID)})
          # try to count pictures in response
          before = 0
          try:
              if isinstance(body, dict):
                  # Beds24 V1 returns array or dict with images
                  txt=json.dumps(body).lower()
                  before = txt.count("picture") + txt.count("image")
          except: pass
          evidence["picture_count_before"]=before
          save_evidence()

          DOWNLOAD_DIR.mkdir(parents=True, exist_ok=True)
          for fname, fid in PHOTO_MANIFEST:
              dest=DOWNLOAD_DIR/fname
              print(f"Downloading {fname}...")
              download_drive_file(fid, dest)
              b=dest.read_bytes()
              evidence["downloaded_files"].append({"filename":fname,"bytes":len(b),"sha256":hashlib.sha256(b).hexdigest()})
              save_evidence()

          # UPLOAD via V1 setPropertyContent - Beds24 V1 accepts images as base64 via setPropertyContent
          # We upload one by one to respect rate limit
          accepted=0
          for fname, _ in PHOTO_MANIFEST:
              path=DOWNLOAD_DIR/fname
              b64=base64.b64encode(path.read_bytes()).decode()
              # Beds24 V1 setPropertyContent format: authentication, propId, images with name and data
              payload={
                  "authentication":{"apiKey":api_key,"propKey":prop_key},
                  "propId": int(PROPERTY_ID),
                  "images": [{"name": fname, "data": b64}]
              }
              # Try setPropertyContent
              for endpoint in ["https://api.beds24.com/json/setPropertyContent","https://api.beds24.com/json/setProperty"]:
                  s, resp = request_json(endpoint, payload)
                  evidence["write_attempts"].append({"filename":fname,"url":endpoint,"http_status":s,"response_keys":list(resp.keys())[:20] if isinstance(resp, dict) else str(resp)[:300]})
                  save_evidence()
                  if 200 <= s < 300:
                      accepted+=1
                      break
                  # small delay to avoid block
              import time; time.sleep(2)

          evidence["accepted_count"]=accepted

          # AFTER count
          status2, body2 = request_json("https://api.beds24.com/json/getPropertyContent", {"authentication":{"apiKey":api_key,"propKey":prop_key},"propId":int(PROPERTY_ID)})
          evidence["picture_count_after"]=evidence["picture_count_before"]
          save_evidence()

          if accepted < 10:
              fail("upload", f"V1 accepted only {accepted}/10. Check BEDS24_API_KEY/PROP_KEY and Beds24 property 324882 access. Attempts: {evidence['write_attempts'][-3:]}")

          evidence["status"]="SUCCESS"
          save_evidence()
          print(json.dumps({"status":"SUCCESS","accepted":accepted,"property":PROPERTY_ID}, ensure_ascii=False))
          PY

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beds24-photo-upload-324882
          path: ${{ runner.temp }}/beds24-324882-v1/evidence.json
          if-no-files-found: warn
          retention-days: 7
