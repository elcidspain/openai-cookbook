name: Update Beds24 Photos AUMARA 324882

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beds24-photos-324882
  cancel-in-progress: true

jobs:
  update-photos:
    name: Upload 10 approved photos to property 324882
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: Production
    env:
      BEDS24_REFRESH_CREDENTIAL: ${{ secrets.BEDS24_REFRESH_CREDENTIAL }}
      BEDS24_API_KEY: ${{ secrets.BEDS24_API_KEY }}
      BEDS24_PROP_KEY: ${{ secrets.BEDS24_PROP_KEY }}
      PROPERTY_ID: "324882"
    steps:
      - name: Authenticate V1, download 10 photos, upload to Beds24
        id: transfer
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import base64, datetime as dt, hashlib, http.cookiejar, json, os, pathlib, re, sys, urllib.error, urllib.parse, urllib.request, uuid
          from typing import Any

          PROPERTY_ID = os.environ.get("PROPERTY_ID", "324882")
          WORK = pathlib.Path(os.environ.get("RUNNER_TEMP", "/tmp")) / "beds24-324882-v1"
          WORK.mkdir(parents=True, exist_ok=True)
          EVIDENCE_PATH = WORK / "evidence.json"
          DOWNLOAD_DIR = WORK / "photos"
          TIMEOUT = 90
          MAX_IMAGE_BYTES = 15_000_000

          PHOTO_MANIFEST = [
              ("01_FULL_no_crop.jpg", "1MAcqpC0veE8DNJuQvViQzCvUqwnlKbY_"),
              ("02_FULL_no_crop.jpg", "19jTCi6FThY584Iebs4vvlPujojSdudQD"),
              ("03_FULL_no_crop.jpg", "1WHAIG1Pz7w0rUwciC7O5dAMbB7WSEKKd"),
              ("04_FULL_no_crop.jpg", "1robOjhdVs12hp6XLbD5AuJsjW84bCxBc"),
              ("06_FULL_no_crop.jpg", "13c7-i9mzpIpX2JJnyyB406T9jp7EMFmV"),
              ("IMG_0005.JPG", "1Cg4Y-skeJ6VNAnfsRPwPEED9RlQ8IIlV"),
              ("IMG_0006.JPG", "1UJaAE4Z9DpVFi67xAG7iZ33l4_xMUS9o"),
              ("IMG_0007.JPG", "17Amun9sFTFpogCN459bhysRkgKCSaMo1"),
              ("IMG_0009.JPG", "1z80jRlJkLwdLkZlLlGv1zNB4i79JhSh8"),
              ("IMG_0011.JPG", "1cqP3azFyywT0jcNO8SfNbQ8lMAoOAtMj"),
          ]

          api_key = (os.environ.get("BEDS24_API_KEY") or "").strip().strip('"').strip("'")
          prop_key = (os.environ.get("BEDS24_PROP_KEY") or "").strip().strip('"').strip("'")
          refresh_credential = (
              os.environ.get("BEDS24_REFRESH_CREDENTIAL")
              or os.environ.get("BEDS24_REFRESH_TOKEN")
              or ""
          ).strip().strip('"').strip("'")
          access_token = ""
          auth_mode = ""
          rotated = ""

          def mask(v: str):
              if v: print(f"::add-mask::{v}", flush=True)
          mask(api_key); mask(prop_key); mask(refresh_credential)

          evidence: dict[str, Any] = {
              "checked_at_utc": dt.datetime.now(dt.timezone.utc).isoformat(),
              "property_id": PROPERTY_ID,
              "auth_mode": None,
              "credential_present": bool((api_key and prop_key) or refresh_credential),
              "token_exchange_http_status": None,
              "rotated_refresh_received": False,
              "downloaded_files": [],
              "write_attempts": [],
              "picture_count_before": None,
              "picture_count_after": None,
          }

          def save_evidence():
              EVIDENCE_PATH.write_text(json.dumps(evidence, indent=2, ensure_ascii=False)+"\n", encoding="utf-8")

          def fail(stage, msg):
              evidence["status"]="FAILED"; evidence["failure_stage"]=stage; evidence["diagnostic"]=msg; save_evidence()
              print(f"ERROR [{stage}]: {msg}", file=sys.stderr); raise SystemExit(1)

          def request_json(url, payload=None, headers=None, method=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(
                  url,
                  data=data,
                  headers={
                      "Accept":"application/json",
                      "User-Agent":"AUMARA-V1/1.0",
                      **({"Content-Type":"application/json"} if data is not None else {}),
                      **(headers or {}),
                  },
                  method=method or ("POST" if data is not None else "GET"),
              )
              try:
                  with urllib.request.urlopen(req, timeout=TIMEOUT) as r:
                      raw=r.read(); status=int(r.status)
              except urllib.error.HTTPError as e:
                  raw=e.read(); status=int(e.code)
              try:
                  body=json.loads(raw.decode('utf-8','replace')) if raw else {}
              except:
                  body={}
              return status, body

          def build_v1_auth_attempts():
              if api_key and prop_key:
                  return [
                      ("api_prop_keys", {"authentication": {"apiKey": api_key, "propKey": prop_key}}, {}),
                  ]
              return [
                  ("access_token_payload", {"authentication": {"token": access_token}}, {}),
                  ("access_token_header", {}, {"token": access_token}),
              ]

          def v1_call(path, payload):
              last_status = 0
              last_body = {}
              last_kind = "unknown"
              for auth_kind, auth_payload, auth_headers in build_v1_auth_attempts():
                  merged = dict(payload)
                  merged.update(auth_payload)
                  status, body = request_json(
                      f"https://api.beds24.com/json/{path}",
                      merged,
                      headers=auth_headers,
                      method="POST",
                  )
                  last_status = status
                  last_body = body
                  last_kind = auth_kind
                  if 200 <= status < 300:
                      return status, body, auth_kind
              return last_status, last_body, last_kind

          def download_drive_file(file_id: str, dest: pathlib.Path):
              cj=http.cookiejar.CookieJar()
              opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
              urls=[
                  f"https://drive.usercontent.google.com/download?id={urllib.parse.quote(file_id)}&export=download&confirm=t",
                  f"https://drive.google.com/uc?export=download&id={urllib.parse.quote(file_id)}&confirm=t",
              ]
              for url in urls:
                  try:
                      with opener.open(urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"}), timeout=TIMEOUT) as resp:
                          raw=resp.read(MAX_IMAGE_BYTES+1)
                      if len(raw)>100_000 and raw.startswith(b"\xff\xd8\xff"):
                          dest.write_bytes(raw); return
                      text=raw[:5000].decode("utf-8","ignore")
                      m=re.search(r"confirm=([0-9A-Za-z_-]+)", text)
                      if m:
                          retry=f"https://drive.google.com/uc?export=download&id={urllib.parse.quote(file_id)}&confirm={urllib.parse.quote(m.group(1))}"
                          with opener.open(urllib.request.Request(retry, headers={"User-Agent":"Mozilla/5.0"}), timeout=TIMEOUT) as resp:
                              raw2=resp.read(MAX_IMAGE_BYTES+1)
                          if len(raw2)>100_000 and raw2.startswith(b"\xff\xd8\xff"):
                              dest.write_bytes(raw2); return
                  except Exception as e:
                      continue
              raise RuntimeError("Google Drive download failed")

          if api_key and prop_key:
              auth_mode = "api_prop_keys"
          elif refresh_credential:
              details_status, details_body = request_json(
                  "https://beds24.com/api/v2/authentication/details",
                  headers={"token": refresh_credential},
                  method="GET",
              )
              if (
                  200 <= details_status < 300
                  and isinstance(details_body, dict)
                  and details_body.get("validToken") is True
              ):
                  access_token = refresh_credential
                  auth_mode = "access_token"
              else:
                  exchange_status, exchange_body = request_json(
                      "https://beds24.com/api/v2/authentication/token",
                      headers={"refreshToken": refresh_credential},
                      method="GET",
                  )
                  evidence["token_exchange_http_status"] = exchange_status
                  candidate = exchange_body.get("token") if isinstance(exchange_body, dict) else None
                  rotated = exchange_body.get("refreshToken") if isinstance(exchange_body, dict) else None
                  if not (
                      200 <= exchange_status < 300
                      and isinstance(candidate, str)
                      and candidate
                  ):
                      fail("credential", f"Beds24 refresh credential did not return access token (HTTP {exchange_status})")
                  access_token = candidate.strip()
                  auth_mode = "refresh_token"
              if isinstance(rotated, str) and rotated:
                  mask(rotated)
                  evidence["rotated_refresh_received"] = True
                  rotated_out = (os.environ.get("BEDS24_ROTATED_OUT") or "").strip()
                  if rotated_out:
                      pathlib.Path(rotated_out).write_text(rotated, encoding="utf-8")
          else:
              fail("credential","No Beds24 credentials found (need API+PROP keys or BEDS24_REFRESH_CREDENTIAL)")
          evidence["auth_mode"] = auth_mode

          # BEFORE count via getPropertyContent V1
          status, body, before_auth_kind = v1_call("getPropertyContent", {"propId":int(PROPERTY_ID)})
          evidence["before_read_auth"] = before_auth_kind
          # try to count pictures in response
          before = 0
          try:
              if isinstance(body, dict):
                  # Beds24 V1 returns array or dict with images
                  txt=json.dumps(body).lower()
                  before = txt.count("picture") + txt.count("image")
          except: pass
          evidence["picture_count_before"]=before
          save_evidence()

          DOWNLOAD_DIR.mkdir(parents=True, exist_ok=True)
          for fname, fid in PHOTO_MANIFEST:
              dest=DOWNLOAD_DIR/fname
              print(f"Downloading {fname}...")
              download_drive_file(fid, dest)
              b=dest.read_bytes()
              evidence["downloaded_files"].append({"filename":fname,"bytes":len(b),"sha256":hashlib.sha256(b).hexdigest()})
              save_evidence()

          # UPLOAD via V1 setPropertyContent - Beds24 V1 accepts images as base64 via setPropertyContent
          # We upload one by one to respect rate limit
          accepted=0
          for fname, _ in PHOTO_MANIFEST:
              path=DOWNLOAD_DIR/fname
              b64=base64.b64encode(path.read_bytes()).decode()
              payload={"propId": int(PROPERTY_ID), "images": [{"name": fname, "data": b64}]}
              # Try setPropertyContent paths and all relevant auth shapes.
              for endpoint in ["https://api.beds24.com/json/setPropertyContent","https://api.beds24.com/json/setProperty"]:
                  wrote = False
                  for auth_kind, auth_payload, auth_headers in build_v1_auth_attempts():
                      write_payload = dict(payload)
                      write_payload.update(auth_payload)
                      s, resp = request_json(endpoint, write_payload, headers=auth_headers, method="POST")
                      evidence["write_attempts"].append({
                          "filename":fname,
                          "url":endpoint,
                          "auth_kind":auth_kind,
                          "http_status":s,
                          "response_keys":list(resp.keys())[:20] if isinstance(resp, dict) else str(resp)[:300]
                      })
                      save_evidence()
                      if 200 <= s < 300:
                          accepted+=1
                          wrote = True
                          break
                  if wrote:
                      break
                  # small delay to avoid block
              import time; time.sleep(2)

          evidence["accepted_count"]=accepted

          # AFTER count
          status2, body2, after_auth_kind = v1_call("getPropertyContent", {"propId":int(PROPERTY_ID)})
          evidence["after_read_auth"] = after_auth_kind
          after = 0
          try:
              if isinstance(body2, dict):
                  txt2=json.dumps(body2).lower()
                  after = txt2.count("picture") + txt2.count("image")
          except:
              pass
          evidence["picture_count_after"]=after
          save_evidence()

          if accepted < 10:
              fail("upload", f"Beds24 accepted only {accepted}/10 using {auth_mode}. Check property 324882 auth scope. Attempts: {evidence['write_attempts'][-3:]}")

          evidence["status"]="SUCCESS"
          save_evidence()
          print(json.dumps({"status":"SUCCESS","accepted":accepted,"property":PROPERTY_ID}, ensure_ascii=False))
          PY

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beds24-photo-upload-324882
          path: ${{ runner.temp }}/beds24-324882-v1/evidence.json
          if-no-files-found: warn
          retention-days: 7
