name: AUMARA Rate Drift Guard v2

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["AUMARA Canonical Rates v2"]
    types: [completed]
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: aumara-rate-drift-guard
  cancel-in-progress: true

jobs:
  guard:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    env:
      BEDS24_API_KEY: ${{ secrets.BEDS24_API_KEY }}
      BEDS24_PROP_KEY: ${{ secrets.BEDS24_PROP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify live prices and flat-rate kill switch
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os, pathlib, time, urllib.error, urllib.request
          cfg=json.loads(pathlib.Path("aumara/config/rate-canonical.json").read_text(encoding="utf-8"))
          api=(os.environ.get("BEDS24_API_KEY") or "").strip(); prop=(os.environ.get("BEDS24_PROP_KEY") or "").strip()
          if not (api and prop): raise SystemExit("Missing Beds24 credentials")
          print(f"::add-mask::{api}"); print(f"::add-mask::{prop}")
          auth={"authentication":{"apiKey":api,"propKey":prop}}

          def response_shape(value):
              if isinstance(value, dict):
                  return {"type": "object", "fields": {
                      str(key): type(item).__name__ for key, item in list(value.items())[:20]
                  }}
              if isinstance(value, list):
                  return {"type": "list", "length": len(value),
                          "first": response_shape(value[0]) if value else None}
              return {"type": type(value).__name__}

          retry_budget = 2

          def api_error(data):
              if not isinstance(data, dict) or not ("error" in data or "errorCode" in data):
                  return None
              code = str(data.get("errorCode", ""))
              return code if len(code) == 4 and code.startswith("10") and code.isascii() and code.isdigit() else "unknown"

          def unverifiable(path, data, detail):
              code = api_error(data)
              suffix = f"; apiErrorCode={code}" if code is not None else ""
              raise SystemExit(
                  f"UNVERIFIABLE: {path}; {detail}{suffix}; shape="
                  + json.dumps(response_shape(data), ensure_ascii=True)
              )

          def call(path,payload):
              global retry_budget
              body=dict(payload); body.update(auth)
              req=urllib.request.Request(f"https://api.beds24.com/json/{path}",data=json.dumps(body).encode(),
                  headers={"Content-Type":"application/json","Accept":"application/json","User-Agent":"AUMARA-rate-guard-v2/1.0"},method="POST")
              while True:
                  try:
                      with urllib.request.urlopen(req,timeout=90) as r: raw=r.read(); st=int(r.status)
                  except urllib.error.HTTPError as e: raw=e.read(); st=int(e.code)
                  except (urllib.error.URLError, TimeoutError):
                      raise SystemExit(f"UNVERIFIABLE: {path}; transport failure")
                  try:
                      data=json.loads(raw.decode("utf-8","replace")) if raw else {}
                  except (ValueError, UnicodeError):
                      raise SystemExit(f"UNVERIFIABLE: {path}; HTTP {st}; non-JSON response")
                  time.sleep(5)
                  code=api_error(data)
                  # Beds24 documents 1016/1020 as a five-minute usage limit.
                  # Bound total extra calls and wait time across the entire run.
                  if code in ("1016", "1020") and retry_budget:
                      retry_budget -= 1
                      print(f"API_LIMIT: {path}; code={code}; retry in 310s", flush=True)
                      time.sleep(310)
                      continue
                  if not 200 <= st < 300 or code is not None:
                      unverifiable(path, data, f"HTTP {st}")
                  return data

          def daily_price_setup(payload, rid):
              # Legacy replies wrap one room in a list; current replies are objects.
              room = payload[0] if isinstance(payload, list) and len(payload) == 1 else payload
              if isinstance(room, dict) and str(room.get("roomId", rid)) == rid:
                  rows = room.get("dailyPrices")
                  if isinstance(rows, list) and rows and isinstance(rows[0], dict):
                      required = ("minStay", "directEnable", "bookingapiEnable", "airbnbxmlEnable")
                      if all(key in rows[0] for key in required):
                          return rows[0]
              shape = {"response": response_shape(payload)}
              if isinstance(room, dict) and "dailyPrices" in room:
                  shape["dailyPrices"] = response_shape(room["dailyPrices"])
              raise SystemExit(
                  f"UNVERIFIABLE: getDailyPriceSetup room {rid}; shape="
                  + json.dumps(shape, ensure_ascii=True)
              )

          def each(a,b):
              d=a
              while d<=b:
                  yield d; d+=dt.timedelta(days=1)

          expected={"674465":{},"674466":{}}
          holidays=set((cfg.get("holidays2026") or []) + (cfg.get("holidays2027") or []))
          delta=int(cfg["policy"]["superiorDeltaEur"])
          for p in cfg["periods"]:
              a=dt.date.fromisoformat(p["from"]); b=dt.date.fromisoformat(p["to"]); base=int(p["chalet"]); flat=bool(p.get("flat"))
              for d in each(a,b):
                  v=base
                  if not flat:
                      if d.isoformat() in holidays: v=int(base*1.20+0.5)
                      elif d.weekday() in (4,5): v=int(base*1.10+0.5)
                  k=d.strftime("%Y%m%d"); expected["674465"][k]=v; expected["674466"][k]=v+delta

          drift=[]
          for rid in expected:
              keys=sorted(expected[rid])
              live=call("getRoomDates",{"roomId":rid,"from":keys[0],"to":keys[-1]})
              if not isinstance(live, dict) or any(not isinstance(live.get(k), dict) for k in expected[rid]):
                  unverifiable("getRoomDates", live, f"room {rid}; missing date records")
              for k,want in expected[rid].items():
                  got=(live.get(k) or {}).get("p1")
                  try: ok=float(got)==float(want)
                  except: ok=False
                  if not ok: drift.append({"kind":"p1","roomId":rid,"date":k,"expected":want,"actual":got})
              setup=daily_price_setup(call("getDailyPriceSetup",{"roomId":rid}),rid)
              min_stay=cfg["policy"]["baseMinStay"]
              if str(setup.get("minStay"))!=str(min_stay): drift.append({"kind":"minStay","roomId":rid,"expected":min_stay,"actual":setup.get("minStay")})
              for key in ("directEnable","bookingapiEnable","airbnbxmlEnable"):
                  if str(setup.get(key))!="1": drift.append({"kind":"channel-source","roomId":rid,"field":key,"actual":setup.get(key)})

          rates=call("getRates",{})
          if not isinstance(rates, list) or any(not isinstance(x, dict) or "rateId" not in x for x in rates):
              unverifiable("getRates", rates, "invalid rate records")
          byid={str(x.get("rateId")):x for x in rates}
          for rate_id in cfg["policy"].get("legacyFlatRateIds",[]):
              got=byid.get(str(rate_id),{}).get("roomPriceEnable")
              if str(got)!="0": drift.append({"kind":"legacy-flat-rate","rateId":rate_id,"actual":got})

          print(json.dumps({"status":"PASS" if not drift else "DRIFT","drift":drift[:100]},ensure_ascii=False,indent=2))
          if drift: raise SystemExit(f"AUMARA pricing drift detected: {len(drift)}")
          PY
