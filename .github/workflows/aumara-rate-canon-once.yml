name: AUMARA Canonical Rates 2026-2028

on:
  workflow_dispatch:
  push:
    paths:
      - "aumara/jobs/aumara-rate-canon-20260922.json"

permissions:
  contents: read

concurrency:
  group: aumara-rate-canon-324882
  cancel-in-progress: false

jobs:
  apply-rates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    env:
      BEDS24_REFRESH_CREDENTIAL: ${{ secrets.BEDS24_REFRESH_CREDENTIAL }}
      BEDS24_API_KEY: ${{ secrets.BEDS24_API_KEY }}
      BEDS24_PROP_KEY: ${{ secrets.BEDS24_PROP_KEY }}
    steps:
      - name: Apply and verify canonical AUMARA rates
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import sys
          import time
          import urllib.error
          import urllib.request

          PROPERTY_ID = 324882
          ROOMS = {"Chalet": 674465, "Superior Chalet": 674466}
          WORK = pathlib.Path(os.environ.get("RUNNER_TEMP", "/tmp")) / "aumara-rate-canon"
          WORK.mkdir(parents=True, exist_ok=True)
          EVIDENCE = WORK / "evidence.json"

          RATES = {
              (2026,10):(210,250), (2026,11):(170,250), (2026,12):(220,310),
              (2027,1):(220,320), (2027,2):(220,320), (2027,3):(230,330),
              (2027,4):(240,340), (2027,5):(250,350), (2027,6):(166,260),
              (2027,9):(218,302), (2027,10):(218,260), (2027,11):(177,260),
              (2027,12):(229,322),
              (2028,1):(229,333), (2028,2):(229,333), (2028,3):(239,343),
              (2028,4):(250,354), (2028,5):(260,364), (2028,6):(173,270),
              (2028,9):(227,314), (2028,10):(227,270), (2028,11):(184,270),
              (2028,12):(238,335),
          }

          def mask(v):
              if v:
                  print(f"::add-mask::{v}", flush=True)

          api_key = (os.environ.get("BEDS24_API_KEY") or "").strip().strip('"').strip("'")
          prop_key = (os.environ.get("BEDS24_PROP_KEY") or "").strip().strip('"').strip("'")
          refresh = (os.environ.get("BEDS24_REFRESH_CREDENTIAL") or "").strip().strip('"').strip("'")
          mask(api_key); mask(prop_key); mask(refresh)
          access_token = ""

          evidence = {
              "property": PROPERTY_ID,
              "rooms": ROOMS,
              "generated_at_utc": dt.datetime.now(dt.timezone.utc).isoformat(),
              "policy": "Canonical monthly target ADR; Fri/Sat +10%; whole EUR; Jul/Aug untouched; starts 2026-10-15",
              "before": {},
              "after": {},
              "write_status": {},
              "mismatches": [],
          }

          def save():
              EVIDENCE.write_text(json.dumps(evidence, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          def request_json(url, payload=None, headers=None, method=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  url,
                  data=data,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "AUMARA-rate-canon/1.0",
                      **({"Content-Type": "application/json"} if data is not None else {}),
                      **(headers or {}),
                  },
                  method=method or ("POST" if data is not None else "GET"),
              )
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      raw = r.read(); status = int(r.status)
              except urllib.error.HTTPError as e:
                  raw = e.read(); status = int(e.code)
              try:
                  body = json.loads(raw.decode("utf-8", "replace")) if raw else {}
              except Exception:
                  body = {"raw": raw.decode("utf-8", "replace")[:1000]}
              return status, body

          if not (api_key and prop_key):
              if not refresh:
                  raise SystemExit("No Beds24 credentials in Production environment")
              st, body = request_json(
                  "https://beds24.com/api/v2/authentication/token",
                  headers={"refreshToken": refresh},
                  method="GET",
              )
              access_token = (body.get("token") or "").strip() if isinstance(body, dict) else ""
              mask(access_token)
              if not (200 <= st < 300 and access_token):
                  raise SystemExit(f"Beds24 token exchange failed HTTP {st}")

          def auth_attempts():
              if api_key and prop_key:
                  return [({"authentication":{"apiKey":api_key,"propKey":prop_key}}, {})]
              return [
                  ({"authentication":{"token":access_token}}, {}),
                  ({}, {"token":access_token}),
              ]

          def v1(path, payload):
              last = (0, {})
              for auth_payload, auth_headers in auth_attempts():
                  body = dict(payload)
                  body.update(auth_payload)
                  st, out = request_json(
                      f"https://api.beds24.com/json/{path}",
                      body,
                      headers=auth_headers,
                      method="POST",
                  )
                  last = (st, out)
                  if 200 <= st < 300:
                      time.sleep(2.2)
                      return st, out
              time.sleep(2.2)
              return last

          def iter_dates(start, end):
              d = start
              while d <= end:
                  yield d
                  d += dt.timedelta(days=1)

          def whole_weekend(base, d):
              return int(base * 1.10 + 0.5) if d.weekday() in (4,5) else int(base)

          expected = {name:{} for name in ROOMS}
          for (year, month), pair in sorted(RATES.items()):
              start = dt.date(year, month, 1)
              if (year, month) == (2026,10):
                  start = dt.date(2026,10,15)
              end = (dt.date(year+1,1,1) if month == 12 else dt.date(year,month+1,1)) - dt.timedelta(days=1)
              for d in iter_dates(start, end):
                  expected["Chalet"][d.strftime("%Y%m%d")] = whole_weekend(pair[0], d)
                  expected["Superior Chalet"][d.strftime("%Y%m%d")] = whole_weekend(pair[1], d)

          def get_chunk(room_id, start, end):
              st, body = v1("getRoomDates", {
                  "roomId": room_id,
                  "from": start.strftime("%Y%m%d"),
                  "to": end.strftime("%Y%m%d"),
              })
              if not 200 <= st < 300:
                  raise RuntimeError(f"getRoomDates {room_id} HTTP {st}: {body}")
              return body if isinstance(body, dict) else {}

          # Backup existing p1 for all affected dates in three API windows per room.
          windows = [
              (dt.date(2026,10,15), dt.date(2026,12,31)),
              (dt.date(2027,1,1), dt.date(2027,12,31)),
              (dt.date(2028,1,1), dt.date(2028,12,31)),
          ]
          for name, room_id in ROOMS.items():
              current = {}
              for a,b in windows:
                  chunk = get_chunk(room_id, a, b)
                  for k,v in chunk.items():
                      if k in expected[name] and isinstance(v, dict):
                          current[k] = v.get("p1")
              evidence["before"][name] = current
              save()

          # One write per room; only p1 is changed. Availability/min-stay/overrides are untouched.
          for name, room_id in ROOMS.items():
              dates = {k: {"p1": str(v)} for k,v in expected[name].items()}
              st, body = v1("setRoomDates", {"roomId": room_id, "dates": dates})
              evidence["write_status"][name] = {"http": st, "response": body}
              save()
              if not 200 <= st < 300:
                  raise RuntimeError(f"setRoomDates {name} HTTP {st}: {body}")

          # Full read-back verification of every changed date.
          for name, room_id in ROOMS.items():
              actual = {}
              for a,b in windows:
                  chunk = get_chunk(room_id, a, b)
                  for k,v in chunk.items():
                      if k in expected[name] and isinstance(v, dict):
                          actual[k] = v.get("p1")
              evidence["after"][name] = actual
              for k,want in expected[name].items():
                  got = actual.get(k)
                  try:
                      ok = float(got) == float(want)
                  except Exception:
                      ok = False
                  if not ok:
                      evidence["mismatches"].append({"room":name,"date":k,"expected":want,"actual":got})
              save()

          if evidence["mismatches"]:
              print(json.dumps(evidence["mismatches"][:20], ensure_ascii=False))
              raise SystemExit(f"Verification failed: {len(evidence['mismatches'])} mismatches")

          print(json.dumps({
              "status":"SUCCESS",
              "property":PROPERTY_ID,
              "changed_dates":{k:len(v) for k,v in expected.items()},
              "mismatches":0,
              "samples":{
                  "2026-10-15":{n: evidence["after"][n].get("20261015") for n in ROOMS},
                  "2026-10-16":{n: evidence["after"][n].get("20261016") for n in ROOMS},
                  "2026-10-17":{n: evidence["after"][n].get("20261017") for n in ROOMS},
                  "2027-07-01":"untouched",
                  "2028-08-01":"untouched",
              }
          }, ensure_ascii=False))
          PY

      - name: Upload rate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aumara-rate-canon-20260922
          path: ${{ runner.temp }}/aumara-rate-canon/evidence.json
          if-no-files-found: warn
          retention-days: 14
