name: AUMARA Canonical Rates v2

on:
  workflow_dispatch:
  push:
    paths:
      - "aumara/jobs/aumara-rate-canon-20260922.json"

permissions:
  contents: write

concurrency:
  group: aumara-rate-write-324882
  cancel-in-progress: false

jobs:
  apply-rates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    env:
      BEDS24_API_KEY: ${{ secrets.BEDS24_API_KEY }}
      BEDS24_PROP_KEY: ${{ secrets.BEDS24_PROP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply AUMARA pricing v2 and verify
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os, pathlib, time, urllib.error, urllib.request

          cfg=json.loads(pathlib.Path("aumara/config/rate-canonical.json").read_text(encoding="utf-8"))
          api=(os.environ.get("BEDS24_API_KEY") or "").strip()
          prop=(os.environ.get("BEDS24_PROP_KEY") or "").strip()
          if not (api and prop): raise SystemExit("Missing Beds24 Production API/PROP keys")
          print(f"::add-mask::{api}"); print(f"::add-mask::{prop}")
          auth={"authentication":{"apiKey":api,"propKey":prop}}
          rooms={"674465":"Chalet","674466":"Superior Chalet"}
          delta=int(cfg["policy"]["superiorDeltaEur"])
          holidays=set(cfg.get("holidays2027") or [])
          legacy=[str(x) for x in cfg["policy"].get("legacyFlatRateIds",[])]
          evidence={"status":"RUNNING","generatedAtUtc":dt.datetime.now(dt.timezone.utc).isoformat(),
                    "configSchema":cfg.get("schemaVersion"),"before":{},"writes":{},"after":{},
                    "dailyPriceSetup":{},"legacyFlatRates":{},"mismatches":[],"samples":{}}

          def call(path,payload,auth_on=True):
              body=dict(payload)
              if auth_on: body.update(auth)
              req=urllib.request.Request(
                  f"https://api.beds24.com/json/{path}",
                  data=json.dumps(body).encode(),
                  headers={"Content-Type":"application/json","Accept":"application/json","User-Agent":"AUMARA-rate-canon-v2/1.0"},
                  method="POST")
              try:
                  with urllib.request.urlopen(req,timeout=90) as r:
                      raw=r.read(); st=int(r.status)
              except urllib.error.HTTPError as e:
                  raw=e.read(); st=int(e.code)
              try: data=json.loads(raw.decode("utf-8","replace")) if raw else {}
              except: data={"raw":raw.decode("utf-8","replace")[:1000]}
              time.sleep(2.2)
              if not 200 <= st < 300: raise RuntimeError(f"{path} HTTP {st}: {data}")
              return data

          def dates(a,b):
              d=a
              while d<=b:
                  yield d
                  d+=dt.timedelta(days=1)

          expected={"674465":{},"674466":{}}
          for p in cfg["periods"]:
              a=dt.date.fromisoformat(p["from"]); b=dt.date.fromisoformat(p["to"])
              base=int(p["chalet"]); flat=bool(p.get("flat"))
              for d in dates(a,b):
                  chalet=base
                  if not flat:
                      if d.isoformat() in holidays:
                          chalet=int(base*1.20+0.5)
                      elif d.weekday() in (4,5):
                          chalet=int(base*1.10+0.5)
                  k=d.strftime("%Y%m%d")
                  expected["674465"][k]=chalet
                  expected["674466"][k]=chalet+delta

          # Safety: keep existing two-night Daily Price row as the channel source.
          for rid,name in rooms.items():
              setup=call("getDailyPriceSetup",{"roomId":rid})
              evidence["dailyPriceSetup"][rid]=setup
              row=setup[0]["dailyPrices"][0]
              if str(row.get("minStay"))!="2":
                  evidence["mismatches"].append({"roomId":rid,"kind":"minStay","expected":"2","actual":row.get("minStay")})
              for key in ("directEnable","bookingapiEnable","airbnbxmlEnable"):
                  if str(row.get(key))!="1":
                      evidence["mismatches"].append({"roomId":rid,"kind":"channel-source","field":key,"actual":row.get(key)})
              if row.get("bookingcomRateCode")!="66887702":
                  evidence["mismatches"].append({"roomId":rid,"kind":"booking-rate-code","actual":row.get("bookingcomRateCode")})
          if evidence["mismatches"]:
              raise SystemExit("Safety gate failed: "+json.dumps(evidence["mismatches"],ensure_ascii=False))

          # Capture current live p1.
          for rid in rooms:
              keys=sorted(expected[rid]); a=keys[0]; b=keys[-1]
              live=call("getRoomDates",{"roomId":rid,"from":a,"to":b})
              evidence["before"][rid]={k:(live.get(k) or {}).get("p1") for k in keys}

          # Write only the Daily Price p1 grid.
          for rid in rooms:
              payload={k:{"p1":str(v)} for k,v in expected[rid].items()}
              out=call("setRoomDates",{"roomId":rid,"dates":payload})
              evidence["writes"][rid]={"count":len(payload),"response":out}

          # Disable the known flat fixed rates that caused 259/329 override.
          rates=call("getRates",{})
          byid={str(x.get("rateId")):x for x in rates if isinstance(x,dict)}
          for rate_id in legacy:
              x=byid.get(rate_id,{})
              evidence["legacyFlatRates"][rate_id]={"before":x.get("roomPriceEnable"),"roomPrice":x.get("roomPrice")}
              if str(x.get("roomPriceEnable"))!="0":
                  out=call("setRate",{"action":"modify","rateId":rate_id,"roomId":str(x.get("roomId")),"roomPriceEnable":"0"})
                  evidence["legacyFlatRates"][rate_id]["write"]=out

          # Full read-back verification.
          for rid in rooms:
              keys=sorted(expected[rid]); a=keys[0]; b=keys[-1]
              live=call("getRoomDates",{"roomId":rid,"from":a,"to":b})
              evidence["after"][rid]={k:(live.get(k) or {}).get("p1") for k in keys}
              for k,want in expected[rid].items():
                  got=(live.get(k) or {}).get("p1")
                  try: ok=float(got)==float(want)
                  except: ok=False
                  if not ok: evidence["mismatches"].append({"roomId":rid,"date":k,"expected":want,"actual":got})

          rates=call("getRates",{})
          byid={str(x.get("rateId")):x for x in rates if isinstance(x,dict)}
          for rate_id in legacy:
              got=byid.get(rate_id,{}).get("roomPriceEnable")
              evidence["legacyFlatRates"].setdefault(rate_id,{})["after"]=got
              if str(got)!="0":
                  evidence["mismatches"].append({"rateId":rate_id,"expected":"roomPriceEnable=0","actual":got})

          sample_dates=["20260926","20261002","20261224","20261225","20270101","20270109","20270319","20270402","20270604","20270917","20271105","20271203"]
          for k in sample_dates:
              evidence["samples"][k]={rid:evidence["after"][rid].get(k) for rid in rooms}

          evidence["status"]="SUCCESS" if not evidence["mismatches"] else "FAILED"
          out=pathlib.Path("aumara/evidence/aumara-rate-canon-v2.json")
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(evidence,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          print(json.dumps({"status":evidence["status"],"writes":{rid:x["count"] for rid,x in evidence["writes"].items()},
                            "samples":evidence["samples"],"mismatches":evidence["mismatches"][:20]},ensure_ascii=False,indent=2))
          if evidence["mismatches"]: raise SystemExit(f"Verification failed: {len(evidence['mismatches'])} mismatches")
          PY

      - name: Commit pricing evidence
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aumara/evidence/aumara-rate-canon-v2.json
          git diff --cached --quiet || git commit -m "Record AUMARA pricing v2 evidence"
          git pull --rebase origin main
          git push origin HEAD:main
