name: Beds24 listing descriptions 2026-10-04

# One-off. workflow_dispatch is intentionally absent: this token cannot start it.
# A push to main that adds the trigger file runs the V2 text write once.
on:
  pull_request:
    paths:
      - ".github/workflows/beds24-listing-descriptions-20261004.yml"
      - "aumara-control-tower/scripts/beds24_listing_descriptions_20261004.py"
      - "aumara-control-tower/scripts/tests/test_beds24_listing_descriptions_20261004.py"
      - "aumara-control-tower/content/beds24-standard-content-20261004.json"
  push:
    branches: [main]
    paths:
      - "beds24/apply-listing-descriptions-20261004.trigger"

permissions:
  contents: write

concurrency:
  group: beds24-listing-descriptions-324882
  cancel-in-progress: false

jobs:
  descriptions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the text guard and the V2 write body
        run: python -m unittest aumara-control-tower/scripts/tests/test_beds24_listing_descriptions_20261004.py -v

      - name: Back up current listing text
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEDS24_REFRESH_CREDENTIAL: ${{ secrets.BEDS24_REFRESH_CREDENTIAL }}
        run: python aumara-control-tower/scripts/beds24_listing_descriptions_20261004.py backup --output beds24/backup-content-20261004.json

      - name: Commit the text backup before any write
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          test -s beds24/backup-content-20261004.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beds24/backup-content-20261004.json
          if git diff --cached --quiet; then
            echo "Backup already committed"
          else
            git commit -m "Record Beds24 listing text backup before description write [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Write description texts and re-read them
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEDS24_REFRESH_CREDENTIAL: ${{ secrets.BEDS24_REFRESH_CREDENTIAL }}
        run: python aumara-control-tower/scripts/beds24_listing_descriptions_20261004.py apply --backup beds24/backup-content-20261004.json --verify beds24/listing-descriptions-verify-20261004.json

      - name: Disable this one-off workflow after a verified write
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          doc = json.load(open("beds24/listing-descriptions-verify-20261004.json", encoding="utf-8"))
          if doc.get("status") != "SUCCESS" or doc.get("mismatches"):
              raise SystemExit(f"Refusing to disable the workflow: {doc.get('status')} {doc.get('mismatches')}")
          print("verified", doc["status"])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beds24/listing-descriptions-verify-20261004.json
          git rm -f .github/workflows/beds24-listing-descriptions-20261004.yml beds24/apply-listing-descriptions-20261004.trigger
          git commit -m "Disable one-off Beds24 listing description workflow [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload backup and verification
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: beds24-listing-descriptions-20261004
          path: |
            beds24/backup-content-20261004.json
            beds24/listing-descriptions-verify-20261004.json
          if-no-files-found: warn
          retention-days: 14
