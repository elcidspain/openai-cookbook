name: Discover RealitySift provider secret names safely

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discover-realitysift-provider-secret-names.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Discover relevant secret names only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, urllib.parse, urllib.request, urllib.error

          repo=os.environ['REPO']
          token=os.environ['GH_TOKEN']
          headers={
            'Authorization': 'Bearer '+token,
            'Accept': 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
          }
          relevant=re.compile(r'NOMINALIA|TEAMBLUE|VERCEL|REGISTRAR|DOMAIN|DNS', re.I)

          def get(path):
            req=urllib.request.Request('https://api.github.com'+path,headers=headers)
            try:
              with urllib.request.urlopen(req,timeout=20) as r:
                return json.load(r), None
            except urllib.error.HTTPError as e:
              return None, {'status':e.code,'reason':e.reason}

          result={'repository':None,'environments':{}}
          data,err=get(f'/repos/{repo}/actions/secrets?per_page=100')
          if err:
            result['repository']={'error':err}
          else:
            names=sorted(x['name'] for x in data.get('secrets',[]) if relevant.search(x.get('name','')))
            result['repository']={'matches':names,'total_seen':data.get('total_count',len(data.get('secrets',[])))}

          envs,err=get(f'/repos/{repo}/environments?per_page=100')
          if err:
            result['environment_list_error']=err
          else:
            for e in envs.get('environments',[]):
              name=e.get('name','')
              enc=urllib.parse.quote(name,safe='')
              data,eerr=get(f'/repos/{repo}/environments/{enc}/secrets?per_page=100')
              if eerr:
                result['environments'][name]={'error':eerr}
              else:
                names=sorted(x['name'] for x in data.get('secrets',[]) if relevant.search(x.get('name','')))
                result['environments'][name]={'matches':names,'total_seen':data.get('total_count',len(data.get('secrets',[])))}

          print(json.dumps(result,ensure_ascii=False,sort_keys=True))
          PY
