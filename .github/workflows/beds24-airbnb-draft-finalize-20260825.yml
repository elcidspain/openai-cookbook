name: Beds24 Airbnb draft finalize AUMARA 2026-08-25

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beds24-airbnb-draft-finalize-20260825.yml'

permissions:
  contents: write

concurrency:
  group: beds24-airbnb-draft-finalize-324882
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: Production
    env:
      BEDS24_VAULT_KEK: ${{ secrets.BEDS24_REFRESH_CREDENTIAL }}
      BEDS24_USERNAME: ${{ secrets.BEDS24_USERNAME }}
      BEDS24_PASSWORD: ${{ secrets.BEDS24_PASSWORD }}
      BEDS24_USER: ${{ secrets.BEDS24_USER }}
      BEDS24_LOGIN: ${{ secrets.BEDS24_LOGIN }}
      BEDS24_API_KEY: ${{ secrets.BEDS24_API_KEY }}
      BEDS24_PROP_KEY: ${{ secrets.BEDS24_PROP_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install browser and media dependencies
        run: |
          pip install --disable-pip-version-check 'gdown>=5.2,<6' 'pillow>=11,<12' 'playwright>=1.55,<2' cryptography
          playwright install --with-deps chromium

      - name: Upload approved 18-photo set with direct Production password
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re

          source = pathlib.Path('aumara-control-tower/scripts/beds24_upload_approved_photo_set.py').read_text(encoding='utf-8')
          source = re.sub(
              r"private_pem = Fernet\(fkey\(KEK\)\)\.decrypt\(\(HS / \"private\.enc\"\)\.read_text\(\)\.strip\(\)\.encode\(\)\)\nprivate = serialization\.load_pem_private_key\(private_pem, password=None\)\npwd_ct = base64\.b64decode\(\(HS / \"password\.enc\"\)\.read_text\(\)\.strip\(\)\)\npassword = \(os\.environ\.get\(\"BEDS24_PASSWORD\"\) or \"\"\)\.strip\(\)\nif not password:\n    password = private\.decrypt\([\s\S]*?\nif not password:\n    raise SystemExit\(\"Beds24 password empty\"\)\nprint\(f\"::add-mask::\{password\}\", flush=True\)",
              "password = (os.environ.get(\"BEDS24_PASSWORD\") or \"\").strip()\nif not password:\n    raise SystemExit(\"BEDS24_PASSWORD missing in Production\")\nprint(f\"::add-mask::{password}\", flush=True)",
              source,
              count=1,
          )
          source = source.replace(
              '        if challenged:\n            subprocess.run(["git", "fetch", "origin", "main"], check=True)',
              '        if challenged:\n            fail("second_factor", "Fresh Beds24 second factor required", page)\n            subprocess.run(["git", "fetch", "origin", "main"], check=True)',
              1,
          )
          runtime = pathlib.Path('/tmp/beds24_upload_approved_photo_set_direct.py')
          runtime.write_text(source, encoding='utf-8')
          compile(source, str(runtime), 'exec')
          exec(compile(source, str(runtime), 'exec'), {'__name__': '__main__', '__file__': str(runtime)})
          PY

      - name: Push updated draft content to both Airbnb listings without publishing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt, json, os, pathlib, re, subprocess, urllib.error, urllib.request
          from playwright.sync_api import sync_playwright

          api=(os.environ.get('BEDS24_API_KEY') or '').strip()
          prop=(os.environ.get('BEDS24_PROP_KEY') or '').strip()
          user=((os.environ.get('BEDS24_USERNAME') or '').strip() or (os.environ.get('BEDS24_USER') or '').strip() or (os.environ.get('BEDS24_LOGIN') or '').strip() or 'EL CID / AUMARA')
          password=(os.environ.get('BEDS24_PASSWORD') or '').strip()
          for secret in (api,prop,user,password):
              if secret: print(f'::add-mask::{secret}')
          if not all((api,prop,password)):
              raise SystemExit('Production Beds24 credentials incomplete')

          def post(path,payload):
              req=urllib.request.Request('https://api.beds24.com/json/'+path,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json','Accept':'application/json'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=90) as r: body=r.read(); status=int(r.status)
              except urllib.error.HTTPError as e: body=e.read(); status=int(e.code)
              data=json.loads(body.decode('utf-8','replace')) if body else {}
              if not 200 <= status < 300: raise SystemExit(f'{path} HTTP {status}: {str(data)[:800]}')
              return data

          def read_state():
              data=post('getPropertyContent',{'authentication':{'apiKey':api,'propKey':prop},'bookingData':False,'images':False,'roomIds':True,'texts':True,'includeAirbnb':True,'includeVrbo':False})
              root=(data.get('getPropertyContent') or [])[0]
              out={}
              for rid in ('674465','674466'):
                  a=((root.get('roomIds') or {}).get(rid) or {}).get('airbnb') or {}
                  out[rid]={k:a.get(k) for k in ('listingId','publish','propertyTypeGroup','listingType','cancellationPolicy')}
              return out

          before=read_state()
          for rid,state in before.items():
              if not str(state.get('listingId') or '').strip(): raise SystemExit(f'{rid}: missing Airbnb listingId')
              if str(state.get('publish') or '').lower()!='no': raise SystemExit(f'{rid}: publish gate is not NO')

          photo_state=json.loads(pathlib.Path('aumara-control-tower/evidence/beds24-photo-set-20260823/state.json').read_text(encoding='utf-8'))
          if photo_state.get('status')!='SUCCESS' or int(photo_state.get('uploaded') or 0)!=18:
              raise SystemExit(f'Photo gate failed: {photo_state}')

          updated=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={'width':1440,'height':1100})
              page.set_default_timeout(30000)
              page.goto('https://beds24.com/control2.php',wait_until='domcontentloaded',timeout=60000)
              u=page.locator("input[name='username'], input[name='user'], input[autocomplete='username'], input[type='email']").first
              if not u.count(): u=page.locator("input[type='text']").first
              pw=page.locator("input[name='password'], input[autocomplete='current-password'], input[type='password']").first
              if not u.count() or not pw.count(): raise SystemExit('Beds24 login fields not found')
              u.fill(user); pw.fill(password)
              btn=page.locator("button[type='submit'], input[type='submit'], #loginButton, button:has-text('Log in'), button:has-text('Login'), button:has-text('Sign in')").first
              if not btn.count(): raise SystemExit('Beds24 login button not found')
              btn.click(); page.wait_for_timeout(5000)
              body=(page.locator('body').inner_text() or '').lower()
              if any(x in body for x in ('two factor','verification code','check your email','login code')):
                  raise SystemExit('Fresh Beds24 second factor required before Airbnb update')
              page.goto('https://beds24.com/control3.php?pagetype=synchroniseairbnbmap',wait_until='domcontentloaded',timeout=60000)
              page.wait_for_timeout(2500)
              for rid in ('674465','674466'):
                  rows=page.locator('tr')
                  target=None
                  for i in range(rows.count()):
                      row=rows.nth(i)
                      txt=(row.inner_text() or '')
                      if rid in txt:
                          target=row; break
                  if target is None: raise SystemExit(f'Mapping row not found for {rid}')
                  update=target.locator("a:has-text('Update'), button:has-text('Update'), input[value*='Update' i]").first
                  if not update.count(): raise SystemExit(f'Update action not found for {rid}')
                  update.click(); page.wait_for_timeout(5000)
                  updated.append(rid)
                  page.goto('https://beds24.com/control3.php?pagetype=synchroniseairbnbmap',wait_until='domcontentloaded',timeout=60000)
                  page.wait_for_timeout(2000)
              browser.close()

          after=read_state()
          blockers=[]
          for rid,state in after.items():
              if str(state.get('publish') or '').lower()!='no': blockers.append(f'{rid}: publish changed')
              if not str(state.get('listingId') or '').strip(): blockers.append(f'{rid}: listingId disappeared')
          evidence={'schema':'aumara.beds24-airbnb-draft-finalize.v1','checked_at_utc':dt.datetime.now(dt.timezone.utc).isoformat(),'property_id':324882,'photo_state':photo_state,'updated_rooms':updated,'before':before,'after':after,'blockers':blockers,'status':'SUCCESS' if not blockers and len(updated)==2 else 'FAILED','secret_exposed':False}
          out=pathlib.Path('aumara-control-tower/evidence/beds24-airbnb-draft-finalize-20260825.json')
          out.write_text(json.dumps(evidence,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',str(out)],check=True)
          if subprocess.run(['git','diff','--cached','--quiet'],check=False).returncode!=0:
              subprocess.run(['git','commit','-m',f'Record AUMARA Airbnb draft finalize {evidence["status"]} [skip ci]'],check=True)
              subprocess.run(['git','pull','--rebase','origin','main'],check=True)
              subprocess.run(['git','push','origin','HEAD:main'],check=True)
          print(json.dumps({'status':evidence['status'],'updated_rooms':updated,'blockers':blockers},ensure_ascii=False))
          if evidence['status']!='SUCCESS': raise SystemExit(1)
          PY