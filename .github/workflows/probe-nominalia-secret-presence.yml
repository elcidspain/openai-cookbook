name: Probe Nominalia credential presence safely

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-nominalia-secret-presence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        environment:
          - NOMINALIA_FTP_PASSWORD
          - Production
          - Preview
          - copilot
          - github-pages
    environment: ${{ matrix.environment }}
    env:
      S_FTP1: ${{ secrets.NOMINALIA_FTP_PASSWORD }}
      S_FTP2: ${{ secrets.NOMINALIAFTPPASSWORD }}
      S_PANEL: ${{ secrets.NOMINALIA_PANEL_PASSWORD }}
      S_CONTROL: ${{ secrets.NOMINALIA_CONTROL_PASSWORD }}
      S_PASS: ${{ secrets.NOMINALIA_PASSWORD }}
      S_USER: ${{ secrets.NOMINALIA_USERNAME }}
      S_TOKEN: ${{ secrets.NOMINALIA_TOKEN }}
      S_API_TOKEN: ${{ secrets.NOMINALIA_API_TOKEN }}
      S_API_KEY: ${{ secrets.NOMINALIA_API_KEY }}
      S_TEAMBLUE: ${{ secrets.TEAMBLUE_API_KEY }}
      V_CONTROL_USER: ${{ vars.NOMINALIA_CONTROL_USER }}
      V_CONTROL_USERNAME: ${{ vars.NOMINALIA_CONTROL_USERNAME }}
      V_USERNAME: ${{ vars.NOMINALIA_USERNAME }}
      V_USER: ${{ vars.NOMINALIA_USER }}
      V_EMAIL: ${{ vars.NOMINALIA_EMAIL }}
      MATRIX_ENV: ${{ matrix.environment }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          names=['S_FTP1','S_FTP2','S_PANEL','S_CONTROL','S_PASS','S_USER','S_TOKEN','S_API_TOKEN','S_API_KEY','S_TEAMBLUE','V_CONTROL_USER','V_CONTROL_USERNAME','V_USERNAME','V_USER','V_EMAIL']
          print(json.dumps({'environment': os.environ.get('MATRIX_ENV',''), 'present': {n: bool(os.environ.get(n)) for n in names}}, sort_keys=True))
          PY
