name: AUMARA Beds24 Rate Architecture Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "aumara/jobs/aumara-beds24-rate-audit.json"

permissions:
  contents: write

concurrency:
  group: aumara-beds24-rate-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    env:
      BEDS24_API_KEY: ${{ secrets.BEDS24_API_KEY }}
      BEDS24_PROP_KEY: ${{ secrets.BEDS24_PROP_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Audit Beds24 property, units, daily price setup and rates
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os, pathlib, time, urllib.error, urllib.request

          OUT = pathlib.Path("aumara/evidence/aumara-beds24-rate-audit.json")
          OUT.parent.mkdir(parents=True, exist_ok=True)
          api = (os.environ.get("BEDS24_API_KEY") or "").strip()
          prop = (os.environ.get("BEDS24_PROP_KEY") or "").strip()
          if not (api and prop):
              raise SystemExit("Missing Beds24 Production API/PROP keys")
          print(f"::add-mask::{api}"); print(f"::add-mask::{prop}")

          auth = {"authentication":{"apiKey":api,"propKey":prop}}

          def call(path, payload):
              body=dict(payload); body.update(auth)
              req=urllib.request.Request(
                  f"https://api.beds24.com/json/{path}",
                  data=json.dumps(body).encode(),
                  headers={"Content-Type":"application/json","Accept":"application/json","User-Agent":"AUMARA-rate-audit/1.0"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      raw=r.read(); status=int(r.status)
              except urllib.error.HTTPError as e:
                  raw=e.read(); status=int(e.code)
              try: data=json.loads(raw.decode("utf-8","replace")) if raw else {}
              except Exception: data={"raw":raw.decode("utf-8","replace")[:1000]}
              time.sleep(2.2)
              if not 200 <= status < 300:
                  raise RuntimeError(f"{path} HTTP {status}: {data}")
              return data

          property_data = call("getProperty", {
              "includeRooms": True,
              "includeRoomUnits": True,
              "includeAccountAccess": False,
          })

          def shape(v,depth=0):
              if depth>3: return type(v).__name__
              if isinstance(v,dict):
                  return {"type":"dict","keys":list(v.keys()),"children":{k:shape(val,depth+1) for k,val in v.items()}}
              if isinstance(v,list):
                  return {"type":"list","len":len(v),"first":shape(v[0],depth+1) if v else None}
              return type(v).__name__

          property_shape=shape(property_data)
          prop_obj={}
          if isinstance(property_data,list):
              prop_obj=next((x for x in property_data if isinstance(x,dict)),{})
          elif isinstance(property_data,dict):
              prop_obj=property_data

          rooms=[]
          candidate=prop_obj.get("roomTypes")
          if candidate is None: candidate=prop_obj.get("rooms")
          if isinstance(candidate,list): rooms=candidate
          elif isinstance(candidate,dict): rooms=list(candidate.values())

          room_summary=[]
          setups={}
          for room in rooms:
              if not isinstance(room,dict): continue
              rid=room.get("roomId")
              summary={k:room.get(k) for k in [
                  "roomId","name","qty","unitNames","unallocatedUnitName",
                  "minStay","maxStay","minPrice","rackRate","cleaningFee","maxPeople",
                  "unitAllocationPerGuest","overbookingProtection","blockAfterCheckout",
                  "p1Sync","p2Sync","p3Sync","p4Sync",
                  "dependentRoomId1","dependentRoomId2","dependentRoomId3","dependentRoomId4",
                  "dependentRoomId5","dependentRoomId6","dependentRoomLogic",
                  "includeBookingsRoomId1","includeBookingsRoomId2","includeBookingsRoomId3",
                  "assignBookingsRoomId1","assignBookingsRoomId2","assignBookingsRoomId3",
                  "bookingComEnableInventory","bookingComEnableBooking",
                  "bookingComRoomCode","bookingComRateCode","airbnbComEnableInventory",
                  "airbnbComEnableBooking","airbnbRoomCode"
              ]}
              units=room.get("roomUnits") or room.get("units") or []
              if isinstance(units,list):
                  summary["units"]=[{k:u.get(k) for k in ["unitId","unitName","unitStatusText"]} for u in units if isinstance(u,dict)]
              room_summary.append(summary)
              if rid:
                  setups[str(rid)] = call("getDailyPriceSetup", {"roomId":str(rid)})

          rates = call("getRates", {})
          rate_links={}
          if isinstance(rates,list):
              for rate in rates:
                  if not isinstance(rate,dict) or not rate.get("rateId"): continue
                  rid=str(rate["rateId"])
                  try: rate_links[rid]=call("getRateLinks", {"rateId":rid})
                  except Exception as e: rate_links[rid]={"auditError":str(e)}

          safe_property = {}
          for k in ["name","propId","currency","city","country","postcode","web",
                    "airbnbPropertyCode","airbnbCurrency","airbnbMultiplier",
                    "bookingComPropertyCode","bookingComMultiplier"]:
              safe_property[k]=prop_obj.get(k)

          evidence={
              "status":"SUCCESS",
              "checkedAtUtc":dt.datetime.now(dt.timezone.utc).isoformat(),
              "property":safe_property,
              "propertyResponseShape":property_shape,
              "rooms":room_summary,
              "dailyPriceSetup":setups,
              "rates":rates,
              "rateLinks":rate_links,
          }
          OUT.write_text(json.dumps(evidence,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          print(json.dumps({
              "status":"SUCCESS",
              "property":safe_property,
              "rooms":room_summary,
              "rateCount": len(rates) if isinstance(rates,list) else None,
          },ensure_ascii=False))
          PY

      - name: Commit sanitized audit evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aumara/evidence/aumara-beds24-rate-audit.json
          git diff --cached --quiet || git commit -m "Record AUMARA Beds24 rate audit"
          git pull --rebase origin main
          git push origin HEAD:main
