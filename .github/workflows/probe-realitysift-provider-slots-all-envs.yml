name: Probe RealitySift provider slots across environments

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-realitysift-provider-slots-all-envs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        environment:
          - NOMINALIA_FTP_PASSWORD
          - Preview
          - 'Preview – elcid-evento-6agosto'
          - 'Preview – openai-cookbook'
          - Production
          - 'Production – elcid-evento-6agosto'
          - 'Production – openai-cookbook'
          - copilot
          - github-pages
    environment: ${{ matrix.environment }}
    env:
      MATRIX_ENV: ${{ matrix.environment }}
      S_NOMINALIA_FTP_PASSWORD: ${{ secrets.NOMINALIA_FTP_PASSWORD }}
      S_NOMINALIAFTPPASSWORD: ${{ secrets.NOMINALIAFTPPASSWORD }}
      S_NOMINALIA_PANEL_PASSWORD: ${{ secrets.NOMINALIA_PANEL_PASSWORD }}
      S_NOMINALIA_CONTROL_PASSWORD: ${{ secrets.NOMINALIA_CONTROL_PASSWORD }}
      S_NOMINALIA_CONTROLPASSWORD: ${{ secrets.NOMINALIA_CONTROLPASSWORD }}
      S_NOMINALIACONTROLPASSWORD: ${{ secrets.NOMINALIACONTROLPASSWORD }}
      S_NOMINALIA_PASSWORD: ${{ secrets.NOMINALIA_PASSWORD }}
      S_NOMINALIA_USERNAME: ${{ secrets.NOMINALIA_USERNAME }}
      S_NOMINALIA_USER: ${{ secrets.NOMINALIA_USER }}
      S_NOMINALIA_TOKEN: ${{ secrets.NOMINALIA_TOKEN }}
      S_NOMINALIA_API_TOKEN: ${{ secrets.NOMINALIA_API_TOKEN }}
      S_NOMINALIA_API_KEY: ${{ secrets.NOMINALIA_API_KEY }}
      S_NOMINALIA_DNS_TOKEN: ${{ secrets.NOMINALIA_DNS_TOKEN }}
      S_NOMINALIA_DNS_API_TOKEN: ${{ secrets.NOMINALIA_DNS_API_TOKEN }}
      S_NOMINALIA_DNS_API_KEY: ${{ secrets.NOMINALIA_DNS_API_KEY }}
      S_TEAMBLUE_API_KEY: ${{ secrets.TEAMBLUE_API_KEY }}
      S_TEAMBLUE_TOKEN: ${{ secrets.TEAMBLUE_TOKEN }}
      S_TEAMBLUE_API_TOKEN: ${{ secrets.TEAMBLUE_API_TOKEN }}
      S_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      S_VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      S_VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      S_VERCEL_AUTH_TOKEN: ${{ secrets.VERCEL_AUTH_TOKEN }}
      S_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      S_VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      S_VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      V_NOMINALIA_USER: ${{ vars.NOMINALIA_USER }}
      V_NOMINALIA_USERNAME: ${{ vars.NOMINALIA_USERNAME }}
      V_NOMINALIA_CONTROL_USER: ${{ vars.NOMINALIA_CONTROL_USER }}
      V_VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      V_VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      V_VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          present=sorted(k[2:] for k,v in os.environ.items() if (k.startswith('S_') or k.startswith('V_')) and v)
          print(json.dumps({'environment':os.environ.get('MATRIX_ENV',''),'present':present},ensure_ascii=False,sort_keys=True))
          PY
