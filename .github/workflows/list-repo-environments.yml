name: List repository environments safely

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/list-repo-environments.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List environment names only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/environments?per_page=100",
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          try:
              with urllib.request.urlopen(req,timeout=20) as r:
                  data=json.load(r)
              print(json.dumps(sorted(e.get('name','') for e in data.get('environments',[]) if e.get('name'))))
          except urllib.error.HTTPError as e:
              print(json.dumps({'status':e.code,'reason':e.reason}))
          PY
